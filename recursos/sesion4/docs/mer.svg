<svg id="merRed" viewBox="0 0 960 616" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="merRed-t">Modelo entidad-relación de la red profesional</title>
<desc id="merRed-d">Cuatro tablas: usuarios, publicaciones, seguidores y mensajes, con relaciones uno a muchos desde usuarios.</desc>
<style>
