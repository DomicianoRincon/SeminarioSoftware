<svg id="merApp" viewBox="0 0 960 560" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif">
<title id="merApp-t">MER de la app</title>
<desc id="merApp-d">Seis tablas: sedes, canchas, deportes, usuarios, reservas y pagos, con relaciones uno a muchos.</desc>
<style>
#merApp .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;font-size:13px;fill:#161A26}
#merApp .nt{font-size:14px;font-weight:700}
#merApp .lk{fill:none;stroke:#556074;stroke-width:1.75}
#merApp .card{stroke-width:1.5}
#merApp .bd{font-size:10.5px;font-weight:700;fill:#fff;letter-spacing:.04em}
#merApp .ca{font-size:13px;font-weight:700;fill:#556074}
</style>
<rect width="960" height="560" rx="16" fill="#FBFBFD"/>
<text x="32" y="44" font-size="20" font-weight="700" fill="#161A26">MER: reserva de canchas</text>
<text x="32" y="66" font-size="13" fill="#79809A">Cada caja es una tabla; cada línea, una relación entre dos tablas.</text>

