:root {
  --icesi-blue: #5454E9;
  --icesi-green: #4CB979;
  --icesi-yellow: #E4EB60;
  --icesi-dark: #393939;
  --icesi-purple: #865CF0;
  --icesi-orange: #E9683B;
  --icesi-gray1: #88898C;
  --icesi-gray2: #CECFD4;
  --icesi-gray-1: #88898C;
  --icesi-gray-2: #CECFD4;
  --icesi-white: #FFFFFF;
  --slide-w: 1280px;
  --slide-h: 720px;
  --logo-top: 24px;
  --logo-left: 72px;
  --logo-w: 165px;
  --num-bottom: 60px;
  --num-lr: 72px;
}
.reveal {
  font-family: "Plus Jakarta Sans", sans-serif !important;
  color: var(--icesi-dark) !important;
}
.reveal .slides {
  text-align: left !important;
}
.reveal .slides > section {
  padding: 0 !important;
  margin: 0 !important;
}
.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--slide-w) !important;
  height: var(--slide-h) !important;
  overflow: hidden;
  background: var(--icesi-white);
  box-sizing: border-box;
  font-family: "Plus Jakarta Sans", sans-serif;
  color: var(--icesi-dark);
}
.slide h1,
.slide h2,
.slide h3,
.slide h4,
.slide p,
.slide li,
.slide span,
.slide div {
  text-transform: none;
  letter-spacing: normal;
  text-shadow: none;
  font-family: "Plus Jakarta Sans", sans-serif;
  line-height: normal;
}
.slide .logo-lockup {
  position: absolute;
  top: var(--logo-top);
  left: var(--logo-left);
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 10;
}
.slide .logo-lockup .logo-icesi {
  width: var(--logo-w);
  height: auto;
  display: block;
}
.slide.sidebar-left .sidebar .logo-lockup {
  transform: scale(0.85);
  transform-origin: top left;
}
.slide .icesi-slide-number {
  position: absolute;
  bottom: var(--num-bottom);
  font-size: 10px;
  font-family: "Plus Jakarta Sans", sans-serif;
  font-weight: 400;
  z-index: 20;
  line-height: 1;
}
.slide .icesi-slide-number.right {
  right: var(--num-lr);
  left: auto;
}
.slide .icesi-slide-number.left {
  left: var(--num-lr);
  right: auto;
}
.slide.standard .slide-header,
.slide.two-cols .slide-header,
.slide.three-cols .slide-header,
.slide.four-cards .slide-header {
  position: absolute;
  left: 0;
  top: 0;
  width: 1280px;
  height: 220px;
}
.slide.standard .slide-header h2,
.slide.two-cols .slide-header h2,
.slide.three-cols .slide-header h2,
.slide.four-cards .slide-header h2 {
  position: absolute;
  left: 32px;
  top: 130px;
  width: 1194px;
  color: var(--icesi-blue);
  font-size: 38px;
  line-height: 46px;
  font-weight: 700;
  hyphens: none;
  margin: 0;
}
.slide .mermaid {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide .mermaid svg {
  max-width: 100% !important;
  height: auto !important;
}
.slide.section-e.bg-blue .mermaid svg,
.slide.section-e.bg-green .mermaid svg,
.slide.section-e.bg-orange .mermaid svg,
.slide.title-a .mermaid svg,
.slide.section-c .mermaid svg {
  background: rgba(255, 255, 255, 0.90);
  border-radius: 10px;
  padding: 12px;
}
.slide.sidebar-left .sidebar .mermaid svg {
  background: rgba(255, 255, 255, 0.88);
  border-radius: 8px;
  padding: 8px;
  max-width: 340px !important;
}
.slide .slide-content h3,
.slide .col h3,
.slide .sidebar-content h3 {
  font-size: 22px;
  font-weight: 700;
  line-height: 28px;
  color: var(--icesi-blue);
  margin: 0 0 8px 0;
}
.slide .slide-content h4,
.slide .col h4,
.slide .sidebar-content h4 {
  font-size: 17px;
  font-weight: 700;
  line-height: 24px;
  color: var(--icesi-dark);
  margin: 6px 0 4px 0;
}
.slide .slide-content li,
.slide .col li,
.slide .sidebar-content li {
  font-size: 19px;
  line-height: 27px;
}
.slide .slide-content p,
.slide .col p,
.slide .sidebar-content p {
  margin-bottom: 10px;
  font-size: 19px;
  line-height: 27px;
}
.slide pre {
  background: #f4f4f8;
  border-left: 4px solid var(--icesi-blue);
  border-radius: 4px;
  padding: 12px 16px;
  font-size: 16px;
  line-height: 24px;
  overflow: auto;
  margin: 12px 0;
}
.slide code {
  font-family:
    "Consolas",
    "Fira Code",
    monospace;
  font-size: 0.9em;
  background: #f0f0f6;
  padding: 1px 5px;
  border-radius: 3px;
}
.slide pre code {
  background: transparent;
  padding: 0;
}
.slide .slide-content img,
.slide .col img {
  max-width: 100%;
  height: auto;
  display: block;
}
.text-blue {
  color: var(--icesi-blue) !important;
}
.text-green {
  color: var(--icesi-green) !important;
}
.text-orange {
  color: var(--icesi-orange) !important;
}
.text-purple {
  color: var(--icesi-purple) !important;
}
.text-dark {
  color: var(--icesi-dark) !important;
}
.slide strong,
.slide b {
  font-weight: 700;
}
.code-box {
  background: #1e1e2e;
  color: #cdd6f4;

  <style>
    /* Cuando la ventana no es exactamente 16:9 (o no está maximizada), Reveal centra
       el lienzo fijo de 1280x720 y deja franjas alrededor — con la ventana normal
       (no pantalla completa) esas franjas SIEMPRE van a aparecer, no hay forma de
       evitarlo sin distorsionar el contenido. Se fuerzan a un solo color oscuro
       consistente (nunca blanco: reveal.css fija su propio fondo en .reveal-viewport,
       a veces con más especificidad/inline, y un blanco que no cubre todo se ve peor
       — mezcla de blanco y negro — que un marco oscuro uniforme). */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d14 !important; }
    .reveal, .reveal-viewport { background: #0d0d14 !important; }
    /* Reveal calcula el tamaño de la presentación con el offsetWidth/Height de
       .reveal (Y.wrapper), no con el de la ventana — y ese tamaño depende de
       heredar height:100% en cascada desde body/html. Cualquier desajuste ahí
       (fuentes pesadas cargando, clases que Reveal agrega de forma async, etc.)
       deja a .reveal más chico que la ventana real, y como el contenido se ancla
       arriba-izquierda dentro de esa caja, el sobrante se ve como franja negra
       abajo/derecha. Se sale de esa cadena de porcentajes fijando .reveal
       directo al viewport, igual que reveal.css hace para su propio :fullscreen. */
    .reveal {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    /* Reveal mantiene en el DOM las slides cercanas (past/future) con display:block
       para las transiciones — a ciertos ratios de ventana (fit exacto en un eje) se
       alcanza a ver un borde de la slide vecina. Ocultarlas por completo salvo la
       activa evita ese sangrado, sin depender del recorte por overflow. */
    .reveal .slides section:not(.present) { visibility: hidden !important; }
    /* Notas de orador (aside.notes) — nunca visibles en la vista principal, solo en
       la Vista de orador (tecla S). Reveal ya las oculta, esto es un respaldo. */
    .reveal .slides section aside.notes { display: none !important; }
    #fullscreen-btn {
      position: fixed; left: 18px; bottom: 14px; z-index: 50;
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 20px; border: none; cursor: pointer;
      background: rgba(255,255,255,0.92); color: #5454E9;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700;
      opacity: 0.7; transition: opacity .15s ease, background .15s ease;
    }
    #fullscreen-btn:hover { opacity: 1; background: #ffffff; }
    #fullscreen-btn svg { flex-shrink: 0; }
    :fullscreen #fullscreen-btn { display: none; }
      
  </style>

  function _logoLockup(icesiSrc, isDark) {
    return `<div class="logo-lockup"><img class="logo-icesi" src="${icesiSrc}" alt="Universidad Icesi"></div>`;
  }
  var state = {
    n: 0,
    logoNegFn: () => _logoLockup(LOGO_NEG, true),
    logoPosFn: () => _logoLockup(LOGO_POS, false)
  };
  function setN(val) {
    state.n = val;
  }
  function getN() {
    return state.n;
  }
  function setLogos(neg, pos) {
    state.logoNegFn = () => _logoLockup(neg, true);
    state.logoPosFn = () => _logoLockup(pos, false);
  }
  function _pageNum(color, side = "right", num) {
    const n = num !== void 0 ? num : state.n;
    const colorMap = {
      white: "#FFFFFF",
      blue: "#5454E9",
      dark: "#393939"
    };
    const c = colorMap[color] || color;
    return `<span class="icesi-slide-number ${side}" style="color:${c}">${n}</span>`;
  }
  function _section(className, content, numColor = "blue", numSide = "right") {
    state.n++;
    return `<section data-slide-index="${state.n}">
  <div class="slide ${className}">
${content}
${_pageNum(numColor, numSide, state.n)}
  </div>
</section>`;
  }

  // src/components/title-slides.js
  function titleSlideA(title, subtitle) {
    return _section("title-a", `
  ${state.logoNegFn()}
  <div class="title-box">
    <h1>${title}</h1>
  </div>
  <div class="subtitle-box">
    <p>${subtitle}</p>
  </div>
  `, "white", "right");
  }
  function titleSlideB(title, subtitle, footer, visual = "") {
    return _section("title-b", `
  ${state.logoPosFn()}
  ${visual}
  <div class="accent-bar"></div>
  <div class="slide-title">${title}</div>
  <div class="slide-subtitle">${subtitle}</div>
  <div class="slide-footer">${footer}</div>
  `, "blue", "left");
  }
  function titleSlideC(title, subtitle) {
    return _section("title-c", `
  ${state.logoPosFn()}
  <div class="blue-block"></div>
  <div class="stripe-pattern"></div>
  <div class="slide-title">${title}</div>
  <div class="slide-subtitle">${subtitle}</div>
  `, "white", "right");
  }

<script>
// Helpers genéricos para armar slides con la librería icesi (window.H).
// Extraídos de la presentación de la Sesión 5 de la microcredencial; sin íconos propios.
// Script plano (no ESM): se carga después de icesi-lib.js y antes de las slides.
// No usa emoji en ningún string; todo marcador va como SVG inline.

(function () {
  'use strict';

  function resize(svg, size) {
    return svg
      .replace(/width="\d+(\.\d+)?"/, 'width="' + size + '"')
      .replace(/height="\d+(\.\d+)?"/, 'height="' + size + '"');
  }

  // Registro de íconos propios del deck. Cada deck agrega los suyos en su helpers.js:
  //   Object.assign(window.H.ICONS, { miIcono: '<svg width="36" height="36" ...>...</svg>' });
  // Estilo: 36x36, círculo de color institucional + trazo blanco. Nunca emoji.
  var ICONS = {};

  // Reutiliza el set base de icesi.icons (check/alert/etc, 22x22) redimensionado a 36.
  function baseIcon(name, size) {
    var svg = window.icesi && window.icesi.icons && window.icesi.icons[name];
    if (!svg) return '';
    return resize(svg, size || 36);
  }

  function ul(items) {
    // items: [[svgIcon, htmlBody], ...]
    var lis = items.map(function (it) {
      return '<li style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;list-style:none;">' +
        '<span style="flex-shrink:0;margin-top:1px;width:26px;height:26px;">' + resize(it[0], 26) + '</span>' +
        '<span>' + it[1] + '</span></li>';
    }).join('');
    return '<ul style="list-style:none;padding-left:0;margin:0;">' + lis + '</ul>';
  }

  function plainUl(items) {
    // lista simple sin icono (para casos donde ya hay demasiados iconos en la slide)
    return '<ul>' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';
  }

  function iconCard(color, icon, title, body) {
    var cls = color ? ' ' + color : '';
    return '<div class="icon-card"><div class="icon-symbol' + cls + '">' + resize(icon, 24) + '</div>' +
      '<div class="icon-body"><strong>' + title + '</strong><span>' + body + '</span></div></div>';
  }

  function grid3(cards) { return '<div class="icon-grid-3">' + cards.join('') + '</div>'; }
  function grid2(cards) { return '<div class="icon-grid-2">' + cards.join('') + '</div>'; }

  function itemRow(icon, title, body) {
    return '<div class="item-row"><div class="item-icon">' + resize(icon, 40) + '</div>' +
      '<div class="item-text"><strong>' + title + '</strong>' + body + '</div></div>';
  }
  function evenly(rows) { return '<div class="items-evenly">' + rows.join('') + '</div>'; }

  function pre(text) {
    return '<pre style="white-space:pre-wrap;word-break:break-word;">' + text + '</pre>';
  }

  function table(headers, rows, compact) {
    var thStyle = compact ? ' style="padding:3px 10px;font-size:12.5px;line-height:15px;"' : '';
    var tdStyle = compact ? ' style="padding:2px 10px;font-size:12px;line-height:14px;"' : '';
    var th = headers.map(function (h) { return '<th' + thStyle + '>' + h + '</th>'; }).join('');
    var trs = rows.map(function (r) {
      return '<tr>' + r.map(function (c) { return '<td' + tdStyle + '>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    return '<table style="width:100%;max-width:100%;box-sizing:border-box;margin-top:' + (compact ? '6px' : '12px') + ';"><thead><tr>' + th + '</tr></thead><tbody>' + trs + '</tbody></table>';
  }

  function arrowRight(color) {
    color = color || '#5454E9';
    return '<svg width="26" height="16" viewBox="0 0 26 16"><line x1="1" y1="8" x2="19" y2="8" stroke="' + color + '" stroke-width="2"/><polyline points="15,3 22,8 15,13" stroke="' + color + '" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function flowNode(icon, label, sub, size) {
    size = size || 52;
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:' + (size + 78) + 'px;text-align:center;">' +
      '<div style="width:' + size + 'px;height:' + size + 'px;">' + resize(icon, size) + '</div>' +
      '<div style="font-size:15px;font-weight:700;color:#393939;">' + label + '</div>' +
      (sub ? '<div style="font-size:12px;color:#88898C;line-height:15px;">' + sub + '</div>' : '') +
      '</div>';
  }

  function pipeline(nodes, opts) {
    opts = opts || {};

  function winChrome(title) {

      '<span style="margin-left:8px;font-size:12px;color:#393939;font-weight:600;">' + title + '</span></div>';

  function winMockup(opts) {

  pfNativo: "<svg id=\"pfNativo\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 376\" width=\"1021\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"pfNativo-ttl pfNativo-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"pfNativo-ttl\">¿Nativo o multiplataforma?</title>\n  <desc id=\"pfNativo-dsc\">Nativo: un código en Kotlin para Android y otro en Swift para iOS; acceso completo a cada sistema, pero todo se construye y mantiene dos veces. Multiplataforma: un solo código en Flutter que llega a Android, iOS, web y escritorio; un código y un equipo, pero lo muy propio de cada sistema cuesta más.</desc>\n  <defs>\n    <style>\n      #pfNativo .title{fill:#161A26;font-size:22px;font-weight:700}\n      #pfNativo .sub{fill:#79809A;font-size:13.5px}\n      #pfNativo .h{font-size:13px;font-weight:700;letter-spacing:.08em}\n      #pfNativo .hs{fill:#79809A;font-size:12.5px}\n      #pfNativo .ct{font-size:14px;font-weight:700}\n      #pfNativo .cs{fill:#454C61;font-size:12.5px}\n      #pfNativo .pc{fill:#454C61;font-size:13px}\n      #pfNativo .tg{font-size:12.5px;font-weight:600}\n    </style>\n    <marker id=\"pfNativo-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/></marker>\n  </defs>\n  <rect width=\"960\" height=\"440\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">¿Nativo o multiplataforma?</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">La misma app para Android e iOS, construida de dos maneras.</text>\n  <rect x=\"48\" y=\"112\" width=\"420\" height=\"296\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <text class=\"h\" x=\"72\" y=\"142\" fill=\"#3A8235\">NATIVO</text><text class=\"hs\" x=\"136\" y=\"142\" data-fit=\"300\">· un código por sistema</text>\n  <rect x=\"72\" y=\"164\" width=\"176\" height=\"64\" rx=\"12\" fill=\"#E8F6E3\" stroke=\"#9FD68D\" stroke-width=\"1.5\"/>\n  <text class=\"ct\" x=\"88\" y=\"191\" fill=\"#3A8235\" data-fit=\"150\">Código Android</text>\n  <text class=\"cs\" x=\"88\" y=\"211\" data-fit=\"150\">Kotlin + Compose</text>\n  <rect x=\"72\" y=\"252\" width=\"176\" height=\"64\" rx=\"12\" fill=\"#E8F6E3\" stroke=\"#9FD68D\" stroke-width=\"1.5\"/>\n  <text class=\"ct\" x=\"88\" y=\"279\" fill=\"#3A8235\" data-fit=\"150\">Código iOS</text>\n  <text class=\"cs\" x=\"88\" y=\"299\" data-fit=\"150\">Swift + SwiftUI</text>\n  <path d=\"M248,196 H320\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#pfNativo-a)\"/>\n  <path d=\"M248,284 H320\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#pfNativo-a)\"/>\n  <rect x=\"328\" y=\"165\" width=\"36\" height=\"62\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#3A8235\" stroke-width=\"1.75\"/>\n  <rect x=\"335\" y=\"175\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#3A8235\" opacity=\"0.4\"/><rect x=\"335\" y=\"183\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#3A8235\" opacity=\"0.4\"/><rect x=\"335\" y=\"191\" width=\"14\" height=\"4\" rx=\"2\" fill=\"#3A8235\" opacity=\"0.4\"/>\n  <rect x=\"328\" y=\"253\" width=\"36\" height=\"62\" rx=\"7\" fill=\"#FFFFFF\" stroke=\"#3A8235\" stroke-width=\"1.75\"/>\n  <rect x=\"335\" y=\"263\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#3A8235\" opacity=\"0.4\"/><rect x=\"335\" y=\"271\" width=\"22\" height=\"4\" rx=\"2\" fill=\"#3A8235\" opacity=\"0.4\"/><rect x=\"335\" y=\"279\" width=\"14\" height=\"4\" rx=\"2\" fill=\"#3A8235\" opacity=\"0.4\"/>\n  <text class=\"tg\" x=\"376\" y=\"200\" fill=\"#3A8235\">Android</text>\n  <text class=\"tg\" x=\"376\" y=\"288\" fill=\"#3A8235\">iOS</text>\n  <text class=\"pc\" x=\"72\" y=\"358\" data-fit=\"380\"><tspan fill=\"#3A8235\" font-weight=\"700\">✓</tspan> Acceso completo a cada sistema</text>\n  <text class=\"pc\" x=\"72\" y=\"382\" data-fit=\"380\"><tspan fill=\"#C2354F\" font-weight=\"700\">✗</tspan> Todo se construye y se mantiene dos veces</text>\n  <rect x=\"492\" y=\"112\" width=\"420\" height=\"296\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"#C9A6EE\" stroke-width=\"2\"/>\n  <text class=\"h\" x=\"516\" y=\"142\" fill=\"#7439B8\">MULTIPLATAFORMA</text><text class=\"hs\" x=\"680\" y=\"142\" data-fit=\"220\">· un código para todos</text>\n  <rect x=\"516\" y=\"190\" width=\"160\" height=\"80\" rx=\"12\" fill=\"#F4EBFF\" stroke=\"#7439B8\" stroke-width=\"2\"/>\n  <text class=\"ct\" x=\"532\" y=\"222\" fill=\"#7439B8\" data-fit=\"130\">Código Flutter</text>\n  <text class=\"cs\" x=\"532\" y=\"244\" data-fit=\"130\">Dart</text>\n  <path d=\"M676,230 L760,177\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.5\" marker-end=\"url(#pfNativo-a)\"/>\n  <rect x=\"768\" y=\"164\" width=\"120\" height=\"26\" rx=\"13\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tg\" x=\"828\" y=\"177\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#7439B8\">Android</text>\n  <path d=\"M676,230 L760,211\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.5\" marker-end=\"url(#pfNativo-a)\"/>\n  <rect x=\"768\" y=\"198\" width=\"120\" height=\"26\" rx=\"13\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tg\" x=\"828\" y=\"211\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#7439B8\">iOS</text>\n  <path d=\"M676,230 L760,245\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.5\" marker-end=\"url(#pfNativo-a)\"/>\n  <rect x=\"768\" y=\"232\" width=\"120\" height=\"26\" rx=\"13\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tg\" x=\"828\" y=\"245\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#7439B8\">Web</text>\n  <path d=\"M676,230 L760,279\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.5\" marker-end=\"url(#pfNativo-a)\"/>\n  <rect x=\"768\" y=\"266\" width=\"120\" height=\"26\" rx=\"13\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tg\" x=\"828\" y=\"279\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#7439B8\">Escritorio</text>\n  <text class=\"pc\" x=\"516\" y=\"358\" data-fit=\"380\"><tspan fill=\"#3A8235\" font-weight=\"700\">✓</tspan> Un código y un equipo para todo</text>\n  <text class=\"pc\" x=\"516\" y=\"382\" data-fit=\"380\"><tspan fill=\"#C2354F\" font-weight=\"700\">✗</tspan> Lo muy propio de cada sistema cuesta más</text>\n</svg>",
  fnServicios: "<svg id=\"fnServicios\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 456\" width=\"842\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"fnServicios-ttl fnServicios-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"fnServicios-ttl\">Tu app y los servicios de la nube</title>\n  <desc id=\"fnServicios-dsc\">Dentro de tu app está el SDK de Supabase, una librería. Tu app le pide cosas al SDK y el SDK habla con tres servicios en la nube: autenticación, que sabe quién es el usuario; base de datos, que guarda y lee información; y storage, que guarda archivos.</desc>\n  <defs>\n    <style>\n      #fnServicios .title{fill:#161A26;font-size:22px;font-weight:700}\n      #fnServicios .sub{fill:#79809A;font-size:13.5px}\n      #fnServicios .h{font-size:13px;font-weight:700;letter-spacing:.08em}\n      #fnServicios .hs{fill:#79809A;font-size:12px}\n      #fnServicios .st{font-size:15px;font-weight:700}\n      #fnServicios .sd{fill:#454C61;font-size:13px}\n      #fnServicios .code{fill:#556074;font-size:11px;font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #fnServicios .foot{fill:#454C61;font-size:13px}\n    </style>\n    <marker id=\"fnServicios-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#7439B8\"/></marker>\n  </defs>\n  <rect width=\"960\" height=\"520\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Tu app y los servicios de la nube</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Tu app no habla directo con la nube: le pide las cosas al SDK, y el SDK se encarga.</text>\n  <rect x=\"48\" y=\"112\" width=\"272\" height=\"352\" rx=\"16\" fill=\"#FAF6FF\" stroke=\"#C9A6EE\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n  <text class=\"h\" x=\"68\" y=\"142\" fill=\"#7439B8\">TU APP</text>\n  <text class=\"hs\" x=\"68\" y=\"160\">hecha con Flutter</text>\n  <rect x=\"116\" y=\"176\" width=\"136\" height=\"172\" rx=\"18\" fill=\"#1F2430\"/>\n  <rect x=\"124\" y=\"186\" width=\"120\" height=\"152\" rx=\"10\" fill=\"#FFFFFF\"/>\n  <path d=\"M124,196 A10,10 0 0 1 134,186 H234 A10,10 0 0 1 244,196 V210 H124 Z\" fill=\"#EADDFF\"/>\n  <text x=\"134\" y=\"198\" dy=\"0.35em\" fill=\"#1D1B20\" font-size=\"10.5\" font-weight=\"600\">Mi perfil</text>\n  <circle cx=\"184\" cy=\"244\" r=\"20\" fill=\"#EADDFF\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <circle cx=\"184\" cy=\"238\" r=\"7\" fill=\"#C9A6EE\"/><path d=\"M171,257 A13,11 0 0 1 197,257\" fill=\"#C9A6EE\"/>\n  <rect x=\"154\" y=\"274\" width=\"60\" height=\"7\" rx=\"3.5\" fill=\"#D9DEE8\"/>\n  <rect x=\"136\" y=\"294\" width=\"96\" height=\"6\" rx=\"3\" fill=\"#EDEFF3\"/><rect x=\"136\" y=\"308\" width=\"72\" height=\"6\" rx=\"3\" fill=\"#EDEFF3\"/>\n  <rect x=\"72\" y=\"366\" width=\"224\" height=\"68\" rx=\"12\" fill=\"#7439B8\"/>\n  <text x=\"88\" y=\"392\" fill=\"#FFFFFF\" font-size=\"14\" font-weight=\"700\">SDK de Supabase</text>\n  <text x=\"88\" y=\"413\" fill=\"#EADDFF\" font-size=\"12\" data-fit=\"196\">una librería dentro de tu app</text>\n  <rect x=\"560\" y=\"112\" width=\"352\" height=\"352\" rx=\"16\" fill=\"#F5F7FA\" stroke=\"#C4CBD8\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n  <text class=\"h\" x=\"580\" y=\"142\" fill=\"#556074\">LA NUBE</text>\n  <text class=\"hs\" x=\"580\" y=\"160\">servicios de Supabase</text>\n  <rect x=\"576\" y=\"168\" width=\"320\" height=\"80\" rx=\"12\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <circle cx=\"616\" cy=\"200\" r=\"9\" fill=\"none\" stroke=\"#4453C9\" stroke-width=\"2.25\"/>\n  <path d=\"M600,228 A16,14 0 0 1 632,228\" fill=\"none\" stroke=\"#4453C9\" stroke-width=\"2.25\"/>\n  <text class=\"st\" x=\"656\" y=\"202\" fill=\"#4453C9\" data-fit=\"220\">Autenticación</text>\n  <text class=\"sd\" x=\"656\" y=\"224\" data-fit=\"224\">¿quién es el usuario?</text>\n  <path d=\"M432,400 V216 Q432,208 440,208 H568\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.75\" marker-end=\"url(#fnServicios-a)\"/>\n  <text class=\"code\" x=\"502\" y=\"200\" text-anchor=\"middle\" data-fit=\"134\">supabase.auth</text>\n  <rect x=\"576\" y=\"264\" width=\"320\" height=\"80\" rx=\"12\" fill=\"#E3F6F3\" stroke=\"#86D3CA\" stroke-width=\"1.5\"/>\n  <path d=\"M598,290 A18,6 0 0 1 634,290 V318 A18,6 0 0 1 598,318 Z\" fill=\"#FFFFFF\" stroke=\"#0F8478\" stroke-width=\"2\"/>\n  <path d=\"M598,290 A18,6 0 0 0 634,290 M598,304 A18,6 0 0 0 634,304\" fill=\"none\" stroke=\"#0F8478\" stroke-width=\"1.5\"/>\n  <text class=\"st\" x=\"656\" y=\"298\" fill=\"#0F8478\" data-fit=\"220\">Base de datos</text>\n  <text class=\"sd\" x=\"656\" y=\"320\" data-fit=\"224\">guarda y lee información</text>\n  <path d=\"M432,400 V312 Q432,304 440,304 H568\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.75\" marker-end=\"url(#fnServicios-a)\"/>\n  <text class=\"code\" x=\"502\" y=\"296\" text-anchor=\"middle\" data-fit=\"134\">supabase.from()</text>\n  <rect x=\"576\" y=\"360\" width=\"320\" height=\"80\" rx=\"12\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\"/>\n  <rect x=\"598\" y=\"382\" width=\"36\" height=\"36\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#A96C05\" stroke-width=\"2\"/>\n  <circle cx=\"624\" cy=\"392\" r=\"4\" fill=\"#A96C05\"/>\n  <path d=\"M600,414 L611,400 L620,410 L625,405 L632,414 Z\" fill=\"#A96C05\" opacity=\"0.6\"/>\n  <text class=\"st\" x=\"656\" y=\"394\" fill=\"#A96C05\" data-fit=\"220\">Storage</text>\n  <text class=\"sd\" x=\"656\" y=\"416\" data-fit=\"224\">guarda archivos: fotos, PDF</text>\n  <path d=\"M296,400 H568\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.75\" marker-end=\"url(#fnServicios-a)\"/>\n  <text class=\"code\" x=\"502\" y=\"392\" text-anchor=\"middle\" data-fit=\"134\">supabase.storage</text>\n  <text class=\"foot\" x=\"48\" y=\"496\" data-fit=\"860\">Tu app llama funciones del SDK. Cómo viaja la información por internet es asunto del SDK, no tuyo.</text>\n</svg>",
  fnEjemplo: "<svg id=\"fnEjemplo\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 336\" width=\"1143\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"fnEjemplo-ttl fnEjemplo-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"fnEjemplo-ttl\">Un ejemplo: cambiar la foto de perfil</title>\n  <desc id=\"fnEjemplo-dsc\">Cuatro pasos. Uno, la persona inicia sesión y autenticación confirma quién es. Dos, la app sube la foto y storage la guarda y devuelve un enlace. Tres, la app guarda ese enlace en la fila del perfil en la base de datos. Cuatro, la pantalla muestra la foto nueva.</desc>\n  <defs>\n    <style>\n      #fnEjemplo .title{fill:#161A26;font-size:22px;font-weight:700}\n      #fnEjemplo .sub{fill:#79809A;font-size:13.5px}\n      #fnEjemplo .bt{font-size:13.5px;font-weight:700}\n      #fnEjemplo .tx{fill:#454C61;font-size:13px}\n      #fnEjemplo .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n    </style>\n    <marker id=\"fnEjemplo-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/></marker>\n  </defs>\n  <rect width=\"960\" height=\"400\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Un ejemplo: cambiar la foto de perfil</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Cada servicio hace una sola cosa. Tu app los combina.</text>\n  <rect x=\"48\" y=\"112\" width=\"192\" height=\"248\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <path d=\"M48,126 A14,14 0 0 1 62,112 H226 A14,14 0 0 1 240,126 V152 H48 Z\" fill=\"#EEF1FF\"/>\n  <circle cx=\"70\" cy=\"132\" r=\"11\" fill=\"#4453C9\"/>\n  <text x=\"70\" y=\"132\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"12\" font-weight=\"700\">1</text>\n  <text class=\"bt\" x=\"90\" y=\"132\" dy=\"0.35em\" fill=\"#4453C9\" data-fit=\"140\">Autenticación</text>\n  <rect x=\"64\" y=\"166\" width=\"160\" height=\"96\" rx=\"10\" fill=\"#F7F8FA\"/>\n  <rect x=\"80\" y=\"180\" width=\"128\" height=\"18\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#C4CBD8\"/>\n  <text x=\"88\" y=\"189\" dy=\"0.35em\" fill=\"#79809A\" font-size=\"10\">ana@correo.com</text>\n  <rect x=\"80\" y=\"204\" width=\"128\" height=\"18\" rx=\"5\" fill=\"#FFFFFF\" stroke=\"#C4CBD8\"/>\n  <text x=\"88\" y=\"213\" dy=\"0.35em\" fill=\"#79809A\" font-size=\"10\">••••••••</text>\n  <rect x=\"80\" y=\"230\" width=\"128\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text x=\"144\" y=\"240\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"10.5\" font-weight=\"700\">Entrar</text>\n  <text class=\"tx\" x=\"64\" y=\"292\" data-fit=\"168\">La persona inicia</text>\n  <text class=\"tx\" x=\"64\" y=\"311\" data-fit=\"168\">sesión y Auth</text>\n  <text class=\"tx\" x=\"64\" y=\"330\" data-fit=\"168\">confirma quién es.</text>\n  <path d=\"M246,236 H266\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#fnEjemplo-a)\"/>\n  <rect x=\"272\" y=\"112\" width=\"192\" height=\"248\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#F0C572\" stroke-width=\"1.5\"/>\n  <path d=\"M272,126 A14,14 0 0 1 286,112 H450 A14,14 0 0 1 464,126 V152 H272 Z\" fill=\"#FFF3DC\"/>\n  <circle cx=\"294\" cy=\"132\" r=\"11\" fill=\"#A96C05\"/>\n  <text x=\"294\" y=\"132\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"12\" font-weight=\"700\">2</text>\n  <text class=\"bt\" x=\"314\" y=\"132\" dy=\"0.35em\" fill=\"#A96C05\" data-fit=\"140\">Storage</text>\n  <rect x=\"288\" y=\"166\" width=\"160\" height=\"96\" rx=\"10\" fill=\"#F7F8FA\"/>\n  <rect x=\"342\" y=\"178\" width=\"52\" height=\"44\" rx=\"6\" fill=\"#FFFFFF\" stroke=\"#A96C05\" stroke-width=\"1.75\"/>\n  <circle cx=\"380\" cy=\"190\" r=\"5\" fill=\"#A96C05\"/>\n  <path d=\"M345,218 L360,200 L372,212 L379,206 L391,218 Z\" fill=\"#A96C05\" opacity=\"0.55\"/>\n  <rect x=\"304\" y=\"236\" width=\"128\" height=\"7\" rx=\"3.5\" fill=\"#EDEFF3\"/>\n  <rect x=\"304\" y=\"236\" width=\"96\" height=\"7\" rx=\"3.5\" fill=\"#A96C05\"/>\n  <text class=\"tx\" x=\"288\" y=\"292\" data-fit=\"168\">La app sube la foto.</text>\n  <text class=\"tx\" x=\"288\" y=\"311\" data-fit=\"168\">Storage la guarda y</text>\n  <text class=\"tx\" x=\"288\" y=\"330\" data-fit=\"168\">devuelve un enlace.</text>\n  <path d=\"M470,236 H490\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#fnEjemplo-a)\"/>\n  <rect x=\"496\" y=\"112\" width=\"192\" height=\"248\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#86D3CA\" stroke-width=\"1.5\"/>\n  <path d=\"M496,126 A14,14 0 0 1 510,112 H674 A14,14 0 0 1 688,126 V152 H496 Z\" fill=\"#E3F6F3\"/>\n  <circle cx=\"518\" cy=\"132\" r=\"11\" fill=\"#0F8478\"/>\n  <text x=\"518\" y=\"132\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"12\" font-weight=\"700\">3</text>\n  <text class=\"bt\" x=\"538\" y=\"132\" dy=\"0.35em\" fill=\"#0F8478\" data-fit=\"140\">Base de datos</text>\n  <rect x=\"512\" y=\"166\" width=\"160\" height=\"96\" rx=\"10\" fill=\"#F7F8FA\"/>\n  <rect x=\"522\" y=\"178\" width=\"140\" height=\"20\" rx=\"5\" fill=\"#0F8478\"/>\n  <text x=\"530\" y=\"188\" dy=\"0.35em\" fill=\"#FFFFFF\" font-size=\"10.5\" font-weight=\"700\" class=\"mono\">perfiles</text>\n  <text x=\"530\" y=\"212\" dy=\"0.35em\" fill=\"#79809A\" font-size=\"10\" class=\"mono\">nombre</text>\n  <text x=\"586\" y=\"212\" dy=\"0.35em\" fill=\"#79809A\" font-size=\"10\" class=\"mono\">foto</text>\n  <rect x=\"522\" y=\"226\" width=\"140\" height=\"22\" rx=\"4\" fill=\"#E3F6F3\" stroke=\"#86D3CA\"/>\n  <text x=\"530\" y=\"237\" dy=\"0.35em\" fill=\"#1D1B20\" font-size=\"10\" class=\"mono\">Ana</text>\n  <text x=\"586\" y=\"237\" dy=\"0.35em\" fill=\"#0F8478\" font-size=\"10\" font-weight=\"700\" class=\"mono\">ana.jpg</text>\n  <text class=\"tx\" x=\"512\" y=\"292\" data-fit=\"168\">La app guarda ese</text>\n  <text class=\"tx\" x=\"512\" y=\"311\" data-fit=\"168\">enlace en la fila</text>\n  <text class=\"tx\" x=\"512\" y=\"330\" data-fit=\"168\">de su perfil.</text>\n  <path d=\"M694,236 H714\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#fnEjemplo-a)\"/>\n  <rect x=\"720\" y=\"112\" width=\"192\" height=\"248\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <path d=\"M720,126 A14,14 0 0 1 734,112 H898 A14,14 0 0 1 912,126 V152 H720 Z\" fill=\"#F4EBFF\"/>\n  <circle cx=\"742\" cy=\"132\" r=\"11\" fill=\"#7439B8\"/>\n  <text x=\"742\" y=\"132\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"12\" font-weight=\"700\">4</text>\n  <text class=\"bt\" x=\"762\" y=\"132\" dy=\"0.35em\" fill=\"#7439B8\" data-fit=\"140\">Tu app</text>\n  <rect x=\"736\" y=\"166\" width=\"160\" height=\"96\" rx=\"10\" fill=\"#F7F8FA\"/>\n  <circle cx=\"816\" cy=\"202\" r=\"24\" fill=\"#FFF3DC\" stroke=\"#7439B8\" stroke-width=\"2\"/>\n  <circle cx=\"825\" cy=\"192\" r=\"5\" fill=\"#A96C05\"/>\n  <path d=\"M798,216 L812,198 L824,210 L829,205 L835,214 A24,24 0 0 1 798,216 Z\" fill=\"#A96C05\" opacity=\"0.55\"/>\n  <rect x=\"788\" y=\"236\" width=\"56\" height=\"7\" rx=\"3.5\" fill=\"#D9DEE8\"/>\n  <text class=\"tx\" x=\"736\" y=\"292\" data-fit=\"168\">La pantalla</text>\n  <text class=\"tx\" x=\"736\" y=\"311\" data-fit=\"168\">muestra la foto</text>\n  <text class=\"tx\" x=\"736\" y=\"330\" data-fit=\"168\">nueva.</text>\n</svg>",
  iaManos: "<svg id=\"iaManos\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 436\" width=\"881\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"iaManos-ttl iaManos-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"iaManos-ttl\">A mano o potenciado con IA</title>\n  <desc id=\"iaManos-dsc\">A mano, tú haces los cuatro pasos: buscar cómo se hace, escribir cada línea, ejecutar y leer errores, y corregir. Con IA, tú decides qué y por qué, la IA escribe y ejecuta, y tú revisas y entiendes. Por eso los conceptos importan más: no puedes revisar lo que no entiendes.</desc>\n  <defs>\n    <style>\n      #iaManos .title{fill:#161A26;font-size:22px;font-weight:700}\n      #iaManos .sub{fill:#79809A;font-size:13.5px}\n      #iaManos .h{font-size:13px;font-weight:700;letter-spacing:.08em}\n      #iaManos .row{fill:#454C61;font-size:13.5px}\n      #iaManos .tag{fill:#FFFFFF;font-size:11px;font-weight:700;letter-spacing:.04em}\n      #iaManos .cap{fill:#454C61;font-size:13px;font-style:italic}\n    </style>\n  </defs>\n  <rect width=\"960\" height=\"500\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">A mano o potenciado con IA</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Cambia quién escribe el código. No cambia quién tiene que entenderlo.</text>\n  <rect x=\"48\" y=\"112\" width=\"408\" height=\"288\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <text class=\"h\" x=\"72\" y=\"144\" fill=\"#556074\">A MANO</text>\n  <rect x=\"72\" y=\"164\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#EEF1FF\"/>\n  <rect x=\"82\" y=\"173\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"100\" y=\"183\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"row\" x=\"132\" y=\"183\" dy=\"0.35em\" data-fit=\"290\">Buscas cómo se hace</text>\n  <rect x=\"72\" y=\"212\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#EEF1FF\"/>\n  <rect x=\"82\" y=\"221\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"100\" y=\"231\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"row\" x=\"132\" y=\"231\" dy=\"0.35em\" data-fit=\"290\">Escribes cada línea</text>\n  <rect x=\"72\" y=\"260\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#EEF1FF\"/>\n  <rect x=\"82\" y=\"269\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"100\" y=\"279\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"row\" x=\"132\" y=\"279\" dy=\"0.35em\" data-fit=\"290\">Ejecutas y lees los errores</text>\n  <rect x=\"72\" y=\"308\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#EEF1FF\"/>\n  <rect x=\"82\" y=\"317\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"100\" y=\"327\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"row\" x=\"132\" y=\"327\" dy=\"0.35em\" data-fit=\"290\">Corriges y vuelves a empezar</text>\n  <text class=\"cap\" x=\"72\" y=\"380\" data-fit=\"360\">Tu tiempo se va en escribir.</text>\n  <rect x=\"504\" y=\"112\" width=\"408\" height=\"288\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <text class=\"h\" x=\"528\" y=\"144\" fill=\"#7439B8\">POTENCIADO CON IA</text>\n  <rect x=\"528\" y=\"164\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#EEF1FF\"/>\n  <rect x=\"538\" y=\"173\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"556\" y=\"183\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"row\" x=\"588\" y=\"183\" dy=\"0.35em\" data-fit=\"290\">Decides qué se hace y por qué</text>\n  <rect x=\"528\" y=\"212\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#F4EBFF\"/>\n  <rect x=\"538\" y=\"221\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#7439B8\"/>\n  <text class=\"tag\" x=\"556\" y=\"231\" dy=\"0.35em\" text-anchor=\"middle\">IA</text>\n  <text class=\"row\" x=\"588\" y=\"231\" dy=\"0.35em\" data-fit=\"290\">Escribe el código y lo ejecuta</text>\n  <rect x=\"528\" y=\"260\" width=\"360\" height=\"38\" rx=\"10\" fill=\"#EEF1FF\"/>\n  <rect x=\"538\" y=\"269\" width=\"36\" height=\"20\" rx=\"10\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"556\" y=\"279\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"row\" x=\"588\" y=\"279\" dy=\"0.35em\" data-fit=\"290\">Revisas y entiendes lo que hizo</text>\n  <text class=\"cap\" x=\"528\" y=\"380\" data-fit=\"360\">Tu tiempo se va en pensar y en revisar.</text>\n  <rect x=\"48\" y=\"420\" width=\"864\" height=\"52\" rx=\"10\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.25\" stroke-dasharray=\"5 4\"/>\n  <text x=\"68\" y=\"446\" dy=\"0.35em\" fill=\"#7C4F04\" font-size=\"14\" data-fit=\"820\"><tspan font-weight=\"700\">Por eso los conceptos importan más, no menos:</tspan> no puedes revisar lo que no entiendes.</text>\n</svg>",
  iaTools: "<svg id=\"iaTools\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 404\" width=\"950\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"iaTools-ttl iaTools-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"iaTools-ttl\">De un chat a un agente</title>\n  <desc id=\"iaTools-dsc\">En un chat en la web la IA solo responde texto y tú copias y pegas en tu proyecto. Un agente en consola tiene un tool system: herramientas para leer archivos, buscar en el código, editar archivos y ejecutar comandos, que usa directamente sobre tu proyecto.</desc>\n  <defs>\n    <style>\n      #iaTools .title{fill:#161A26;font-size:22px;font-weight:700}\n      #iaTools .sub{fill:#79809A;font-size:13.5px}\n      #iaTools .h{font-size:13px;font-weight:700;letter-spacing:.08em}\n      #iaTools .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #iaTools .tool{fill:#7439B8;font-size:12.5px;font-weight:600}\n      #iaTools .cap{fill:#454C61;font-size:13.5px}\n      #iaTools .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n    </style>\n    <marker id=\"iaTools-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#7439B8\"/></marker>\n    <marker id=\"iaTools-g\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#79809A\"/></marker>\n  </defs>\n  <rect width=\"960\" height=\"468\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">De un chat a un agente</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">La diferencia no es el modelo de IA: es a qué tiene acceso.</text>\n  <rect x=\"48\" y=\"112\" width=\"408\" height=\"296\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <text class=\"h\" x=\"72\" y=\"144\" fill=\"#556074\">CHAT EN LA WEB</text>\n  <rect x=\"72\" y=\"164\" width=\"176\" height=\"164\" rx=\"10\" fill=\"#F5F7FA\" stroke=\"#C4CBD8\" stroke-width=\"1.25\"/>\n  <rect x=\"140\" y=\"178\" width=\"96\" height=\"22\" rx=\"11\" fill=\"#EEF1FF\"/>\n  <rect x=\"152\" y=\"187\" width=\"72\" height=\"5\" rx=\"2.5\" fill=\"#A9B4F2\"/>\n  <rect x=\"84\" y=\"212\" width=\"140\" height=\"96\" rx=\"10\" fill=\"#F4EBFF\"/>\n  <rect x=\"96\" y=\"226\" width=\"90\" height=\"5\" rx=\"2.5\" fill=\"#C9A6EE\"/>\n  <rect x=\"96\" y=\"238\" width=\"110\" height=\"5\" rx=\"2.5\" fill=\"#C9A6EE\"/>\n  <rect x=\"96\" y=\"250\" width=\"70\" height=\"5\" rx=\"2.5\" fill=\"#C9A6EE\"/>\n  <rect x=\"96\" y=\"264\" width=\"116\" height=\"32\" rx=\"5\" fill=\"#1F2430\"/>\n  <rect x=\"104\" y=\"273\" width=\"60\" height=\"4\" rx=\"2\" fill=\"#DCDCAA\"/><rect x=\"104\" y=\"283\" width=\"84\" height=\"4\" rx=\"2\" fill=\"#9AA3B5\"/>\n  <path d=\"M256,246 H336\" fill=\"none\" stroke=\"#79809A\" stroke-width=\"1.75\" stroke-dasharray=\"6 5\" marker-end=\"url(#iaTools-g)\"/>\n  <circle cx=\"296\" cy=\"246\" r=\"13\" fill=\"#FFFFFF\" stroke=\"#4453C9\" stroke-width=\"1.75\"/>\n  <circle cx=\"296\" cy=\"242\" r=\"3.5\" fill=\"#4453C9\"/><path d=\"M289,253 A7,6 0 0 1 303,253\" fill=\"#4453C9\"/>\n  <text class=\"lbl\" x=\"296\" y=\"280\" text-anchor=\"middle\">tú copias</text><text class=\"lbl\" x=\"296\" y=\"296\" text-anchor=\"middle\">y pegas</text>\n  <path d=\"M348,222 Q348,212 358,212 H374 L382,222 H410 Q420,222 420,232 V264 Q420,274 410,274 H358 Q348,274 348,264 Z\" fill=\"#E3F6F3\" stroke=\"#0F8478\" stroke-width=\"1.75\"/>\n  <text x=\"384\" y=\"296\" text-anchor=\"middle\" fill=\"#0F8478\" font-size=\"12.5\" font-weight=\"700\">Tu</text>\n  <text x=\"384\" y=\"312\" text-anchor=\"middle\" fill=\"#0F8478\" font-size=\"12.5\" font-weight=\"700\">proyecto</text>\n  <text class=\"cap\" x=\"72\" y=\"388\" data-fit=\"360\">La IA solo habla. <tspan font-weight=\"700\">Tú haces el resto.</tspan></text>\n  <rect x=\"504\" y=\"112\" width=\"408\" height=\"296\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"#C9A6EE\" stroke-width=\"2\"/>\n  <text class=\"h\" x=\"528\" y=\"144\" fill=\"#7439B8\">AGENTE EN CONSOLA</text>\n  <rect x=\"528\" y=\"209\" width=\"96\" height=\"84\" rx=\"12\" fill=\"#7439B8\"/>\n  <text x=\"576\" y=\"243\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"14\" font-weight=\"700\">Modelo</text>\n  <text x=\"576\" y=\"261\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"14\" font-weight=\"700\">de IA</text>\n  <path d=\"M624,251 L652,188\" fill=\"none\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <rect x=\"656\" y=\"172\" width=\"140\" height=\"32\" rx=\"16\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tool\" x=\"726\" y=\"188\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"150\">Leer archivos</text>\n  <path d=\"M796,188 L812,251\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.5\" marker-end=\"url(#iaTools-a)\"/>\n  <path d=\"M624,251 L652,230\" fill=\"none\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <rect x=\"656\" y=\"214\" width=\"140\" height=\"32\" rx=\"16\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tool\" x=\"726\" y=\"230\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"150\">Buscar en el código</text>\n  <path d=\"M796,230 L812,251\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.5\" marker-end=\"url(#iaTools-a)\"/>\n  <path d=\"M624,251 L652,272\" fill=\"none\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <rect x=\"656\" y=\"256\" width=\"140\" height=\"32\" rx=\"16\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tool\" x=\"726\" y=\"272\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"150\">Editar archivos</text>\n  <path d=\"M796,272 L812,251\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.5\" marker-end=\"url(#iaTools-a)\"/>\n  <path d=\"M624,251 L652,314\" fill=\"none\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <rect x=\"656\" y=\"298\" width=\"140\" height=\"32\" rx=\"16\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.25\"/>\n  <text class=\"tool\" x=\"726\" y=\"314\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"150\">Ejecutar comandos</text>\n  <path d=\"M796,314 L812,251\" fill=\"none\" stroke=\"#7439B8\" stroke-width=\"1.5\" marker-end=\"url(#iaTools-a)\"/>\n  <path d=\"M820,230 Q820,220 830,220 H846 L854,230 H882 Q892,230 892,240 V272 Q892,282 882,282 H830 Q820,282 820,272 Z\" fill=\"#E3F6F3\" stroke=\"#0F8478\" stroke-width=\"1.75\"/>\n  <text x=\"856\" y=\"304\" text-anchor=\"middle\" fill=\"#0F8478\" font-size=\"12.5\" font-weight=\"700\">Tu</text>\n  <text x=\"856\" y=\"320\" text-anchor=\"middle\" fill=\"#0F8478\" font-size=\"12.5\" font-weight=\"700\">proyecto</text>\n  <rect x=\"652\" y=\"160\" width=\"148\" height=\"182\" rx=\"12\" fill=\"none\" stroke=\"#C9A6EE\" stroke-width=\"1.25\" stroke-dasharray=\"5 4\"/>\n  <text x=\"726\" y=\"358\" text-anchor=\"middle\" fill=\"#7439B8\" font-size=\"12\" font-weight=\"700\" letter-spacing=\".06em\">TOOL SYSTEM</text>\n  <text class=\"cap\" x=\"528\" y=\"388\" data-fit=\"370\">La IA lee, edita y <tspan font-weight=\"700\">ejecuta en tu proyecto.</tspan></text>\n  <text x=\"48\" y=\"440\" fill=\"#454C61\" font-size=\"13.5\" data-fit=\"860\">Como puede tocar tus archivos y tu terminal, el agente <tspan font-weight=\"700\">pide permiso</tspan> antes de las acciones delicadas.</text>\n</svg>",
  iaMando: "<svg id=\"iaMando\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 428\" width=\"897\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"iaMando-ttl iaMando-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"iaMando-ttl\">Tú al mando: human in the lead</title>\n  <desc id=\"iaMando-dsc\">Un ciclo de cuatro pasos: tú defines qué, por qué y con qué reglas; la IA propone y hace los cambios con sus herramientas; tú revisas si entiendes lo que hizo; tú decides si aceptas, corriges o descartas. Tú respondes por el resultado. A diferencia de human in the loop, donde la IA dirige y la persona solo aprueba, en human in the lead la persona dirige.</desc>\n  <defs>\n    <style>\n      #iaMando .title{fill:#161A26;font-size:22px;font-weight:700}\n      #iaMando .sub{fill:#79809A;font-size:13.5px}\n      #iaMando .nt{font-size:14px;font-weight:700}\n      #iaMando .nd{fill:#454C61;font-size:12.5px}\n      #iaMando .tag{fill:#FFFFFF;font-size:10.5px;font-weight:700;letter-spacing:.04em}\n      #iaMando .h{font-size:12.5px;font-weight:700;letter-spacing:.06em}\n      #iaMando .cb{fill:#454C61;font-size:13px}\n    </style>\n    <marker id=\"iaMando-a\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/></marker>\n  </defs>\n  <rect width=\"960\" height=\"492\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Tú al mando: <tspan fill=\"#4453C9\">human in the lead</tspan></text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">La IA hace mucho del trabajo. Las decisiones siguen siendo tuyas.</text>\n  <path d=\"M428,152 Q500,152 500,236\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#iaMando-a)\"/>\n  <path d=\"M500,312 Q500,404 436,404\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#iaMando-a)\"/>\n  <path d=\"M220,404 Q148,404 148,320\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#iaMando-a)\"/>\n  <path d=\"M148,244 Q148,152 212,152\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.75\" marker-end=\"url(#iaMando-a)\"/>\n  <rect x=\"220\" y=\"118\" width=\"208\" height=\"68\" rx=\"14\" fill=\"#EEF1FF\" stroke=\"#4453C9\" stroke-width=\"2.5\"/>\n  <rect x=\"234\" y=\"131\" width=\"34\" height=\"18\" rx=\"9\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"251\" y=\"140\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"nt\" x=\"276\" y=\"140\" dy=\"0.35em\" fill=\"#4453C9\" data-fit=\"144\">1 · Defines</text>\n  <text class=\"nd\" x=\"234\" y=\"170\" data-fit=\"224\">qué, por qué y con qué reglas</text>\n  <rect x=\"396\" y=\"244\" width=\"208\" height=\"68\" rx=\"14\" fill=\"#F4EBFF\" stroke=\"#7439B8\" stroke-width=\"1.5\"/>\n  <rect x=\"410\" y=\"257\" width=\"34\" height=\"18\" rx=\"9\" fill=\"#7439B8\"/>\n  <text class=\"tag\" x=\"427\" y=\"266\" dy=\"0.35em\" text-anchor=\"middle\">IA</text>\n  <text class=\"nt\" x=\"452\" y=\"266\" dy=\"0.35em\" fill=\"#7439B8\" data-fit=\"144\">2 · Propone y hace</text>\n  <text class=\"nd\" x=\"410\" y=\"296\" data-fit=\"204\">con sus herramientas</text>\n  <rect x=\"220\" y=\"370\" width=\"208\" height=\"68\" rx=\"14\" fill=\"#EEF1FF\" stroke=\"#4453C9\" stroke-width=\"2.5\"/>\n  <rect x=\"234\" y=\"383\" width=\"34\" height=\"18\" rx=\"9\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"251\" y=\"392\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"nt\" x=\"276\" y=\"392\" dy=\"0.35em\" fill=\"#4453C9\" data-fit=\"144\">3 · Revisas</text>\n  <text class=\"nd\" x=\"234\" y=\"422\" data-fit=\"204\">¿entiendes lo que hizo?</text>\n  <rect x=\"44\" y=\"244\" width=\"208\" height=\"68\" rx=\"14\" fill=\"#EEF1FF\" stroke=\"#4453C9\" stroke-width=\"2.5\"/>\n  <rect x=\"58\" y=\"257\" width=\"34\" height=\"18\" rx=\"9\" fill=\"#4453C9\"/>\n  <text class=\"tag\" x=\"75\" y=\"266\" dy=\"0.35em\" text-anchor=\"middle\">TÚ</text>\n  <text class=\"nt\" x=\"100\" y=\"266\" dy=\"0.35em\" fill=\"#4453C9\" data-fit=\"144\">4 · Decides</text>\n  <text class=\"nd\" x=\"58\" y=\"296\" data-fit=\"224\">aceptas, corriges o descartas</text>\n  <text x=\"324\" y=\"270\" text-anchor=\"middle\" fill=\"#161A26\" font-size=\"14\" font-weight=\"700\">Tú respondes</text>\n  <text x=\"324\" y=\"290\" text-anchor=\"middle\" fill=\"#161A26\" font-size=\"14\" font-weight=\"700\">por el resultado</text>\n  <rect x=\"640\" y=\"136\" width=\"272\" height=\"116\" rx=\"12\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <text class=\"h\" x=\"660\" y=\"164\" fill=\"#556074\">HUMAN IN THE LOOP</text>\n  <text class=\"cb\" x=\"660\" y=\"190\" data-fit=\"236\">La IA dirige y tú apruebas lo</text>\n  <text class=\"cb\" x=\"660\" y=\"209\" data-fit=\"248\">que te muestra. Si no entiendes,</text>\n  <text class=\"cb\" x=\"660\" y=\"228\" data-fit=\"236\">apruebas a ciegas.</text>\n  <rect x=\"640\" y=\"272\" width=\"272\" height=\"116\" rx=\"12\" fill=\"#EEF1FF\" stroke=\"#4453C9\" stroke-width=\"2.5\"/>\n  <text class=\"h\" x=\"660\" y=\"300\" fill=\"#4453C9\">HUMAN IN THE LEAD</text>\n  <text class=\"cb\" x=\"660\" y=\"326\" data-fit=\"236\">Tú diriges: decides el objetivo,</text>\n  <text class=\"cb\" x=\"660\" y=\"345\" data-fit=\"236\">las reglas y cuándo algo está</text>\n  <text class=\"cb\" x=\"660\" y=\"364\" data-fit=\"236\">bien. <tspan font-weight=\"700\" fill=\"#4453C9\">Es lo que buscamos.</tspan></text>\n  <text x=\"48\" y=\"468\" fill=\"#454C61\" font-size=\"13.5\" data-fit=\"860\">Si la IA se equivoca y tú lo aceptaste, el error es tuyo. Por eso nunca se acepta un cambio que no entiendes.</text>\n</svg>",
  fiPiezas: "<svg id=\"fiPiezas\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 64 960 496\" width=\"774\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"fiPiezas-ttl fiPiezas-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"fiPiezas-ttl\">Las piezas de la instalación básica</title>\n  <desc id=\"fiPiezas-dsc\">Ya tienes Git y Visual Studio Code. La extensión de Flutter descarga el Flutter SDK, que incluye Dart, y lo agrega al PATH. Con eso la app corre en Chrome; Android e iOS se configuran en la instalación avanzada.</desc>\n  <defs>\n    <style>\n      #fiPiezas .card{stroke-width:1.5}\n      #fiPiezas .hero{stroke-width:2.5;filter:url(#fiPiezas-lift)}\n      #fiPiezas .n-indigo{fill:#EEF1FF;stroke:#A9B4F2} #fiPiezas .t-indigo{fill:#4453C9}\n      #fiPiezas .n-violet{fill:#F4EBFF;stroke:#C9A6EE} #fiPiezas .t-violet{fill:#7439B8}\n      #fiPiezas .n-amber{fill:#FFF3DC;stroke:#F0C572} #fiPiezas .t-amber{fill:#A96C05}\n      #fiPiezas .n-green{fill:#E8F6E3;stroke:#9FD68D} #fiPiezas .t-green{fill:#3A8235}\n      #fiPiezas .n-slate{fill:#EFF1F5;stroke:#C4CBD8} #fiPiezas .t-slate{fill:#556074}\n      #fiPiezas .title{fill:#161A26;font-size:22px;font-weight:700}\n      #fiPiezas .sub{fill:#79809A;font-size:13.5px}\n      #fiPiezas .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #fiPiezas .nt{font-size:16px;font-weight:600}\n      #fiPiezas .nb{fill:#454C61;font-size:13px}\n      #fiPiezas .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #fiPiezas .foot{fill:#79809A;font-size:12px}\n      #fiPiezas .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #fiPiezas .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#fiPiezas-arrow)}\n      #fiPiezas .soft{stroke:#A0A8B8;stroke-dasharray:6 5;marker-end:url(#fiPiezas-arrow-soft)}\n    </style>\n    <marker id=\"fiPiezas-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n    <marker id=\"fiPiezas-arrow-soft\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#A0A8B8\"/>\n    </marker>\n    <filter id=\"fiPiezas-lift\" x=\"-25%\" y=\"-25%\" width=\"150%\" height=\"150%\">\n      <feDropShadow dx=\"0\" dy=\"3\" stdDeviation=\"6\" flood-color=\"#0B1020\" flood-opacity=\"0.14\"/>\n    </filter>\n  </defs>\n\n  <rect width=\"960\" height=\"560\" rx=\"16\" fill=\"#FFFFFF\"/>\n\n  <text class=\"title\" x=\"48\" y=\"56\">Las piezas de la instalación básica</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Ya tienes Git y VS Code. La extensión de Flutter se encarga del resto.</text>\n\n  <text class=\"h\" x=\"48\" y=\"120\">LO QUE YA TIENES</text>\n  <text class=\"h\" x=\"344\" y=\"120\">LO QUE HACE LA EXTENSIÓN</text>\n  <text class=\"h\" x=\"696\" y=\"120\">DÓNDE CORRE TU APP</text>\n\n  <g transform=\"translate(48,136)\">\n    <rect class=\"card n-indigo\" width=\"232\" height=\"80\" rx=\"12\"/>\n    <text class=\"nt t-indigo\" x=\"16\" y=\"32\" data-fit=\"200\">Visual Studio Code</text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"200\">el editor donde vas a trabajar</text>\n  </g>\n  <g transform=\"translate(48,248)\">\n    <rect class=\"card n-slate\" width=\"232\" height=\"80\" rx=\"12\"/>\n    <text class=\"nt t-slate\" x=\"16\" y=\"32\" data-fit=\"200\">Git</text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"200\">con él se descarga Flutter</text>\n  </g>\n\n  <path class=\"link\" d=\"M280,176 H336\"/>\n  <text class=\"lbl\" x=\"308\" y=\"166\" text-anchor=\"middle\" data-fit=\"56\">instala</text>\n\n  <g transform=\"translate(344,136)\">\n    <rect class=\"card n-violet\" width=\"288\" height=\"80\" rx=\"12\"/>\n    <text class=\"nt t-violet\" x=\"16\" y=\"32\" data-fit=\"256\">Extensión Flutter</text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"256\">trae también la extensión de Dart</text>\n  </g>\n\n  <path class=\"link\" d=\"M488,216 V256\"/>\n  <text class=\"lbl\" x=\"500\" y=\"240\" data-fit=\"120\">Download SDK</text>\n  <path class=\"link\" d=\"M280,300 H336\"/>\n  <text class=\"lbl\" x=\"308\" y=\"290\" text-anchor=\"middle\" data-fit=\"56\">clona</text>\n\n  <g transform=\"translate(344,264)\">\n    <rect class=\"card hero n-indigo\" width=\"288\" height=\"112\" rx=\"12\" stroke=\"#4453C9\"/>\n    <text class=\"nt t-indigo\" x=\"16\" y=\"32\" data-fit=\"256\">Flutter SDK</text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"256\">el comando <tspan class=\"mono\">flutter</tspan> + el Dart SDK</text>\n    <text class=\"nb mono\" x=\"16\" y=\"84\" data-fit=\"256\">C:\\develop\\flutter</text>\n    <text class=\"nb mono\" x=\"16\" y=\"100\" font-size=\"11.5\" fill=\"#79809A\" data-fit=\"256\">~/develop/flutter  (Mac/Linux)</text>\n  </g>\n\n  <path class=\"link\" d=\"M488,376 V416\"/>\n  <text class=\"lbl\" x=\"500\" y=\"400\" data-fit=\"120\">Add SDK to PATH</text>\n\n  <g transform=\"translate(344,424)\">\n    <rect class=\"card n-amber\" width=\"288\" height=\"72\" rx=\"12\"/>\n    <text class=\"nt t-amber\" x=\"16\" y=\"30\" data-fit=\"256\">PATH del sistema</text>\n    <text class=\"nb\" x=\"16\" y=\"54\" data-fit=\"256\"><tspan class=\"mono\">flutter</tspan> funciona en cualquier terminal</text>\n  </g>\n\n  <path class=\"link\" d=\"M632,320 H664 V184 Q664,176 672,176 H688\"/>\n  <path class=\"link soft\" d=\"M664,288 H688\"/>\n  <path class=\"link soft\" d=\"M664,320 V392 Q664,400 672,400 H688\"/>\n\n  <g transform=\"translate(696,136)\">\n    <rect class=\"card n-green\" width=\"216\" height=\"80\" rx=\"12\" stroke-width=\"2\"/>\n    <text class=\"nt t-green\" x=\"16\" y=\"32\" data-fit=\"184\">Chrome (web)</text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"184\">sesión 1: con esto basta</text>\n  </g>\n  <g transform=\"translate(696,248)\">\n    <rect class=\"card n-slate\" width=\"216\" height=\"80\" rx=\"12\" stroke-dasharray=\"6 5\"/>\n    <text class=\"nt t-slate\" x=\"16\" y=\"32\" data-fit=\"184\">Android</text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"184\">→ Instalación avanzada</text>\n  </g>\n  <g transform=\"translate(696,360)\">\n    <rect class=\"card n-slate\" width=\"216\" height=\"80\" rx=\"12\" stroke-dasharray=\"6 5\"/>\n    <text class=\"nt t-slate\" x=\"16\" y=\"32\" data-fit=\"184\">iOS <tspan class=\"nb\">(solo en Mac)</tspan></text>\n    <text class=\"nb\" x=\"16\" y=\"56\" data-fit=\"184\">→ Instalación avanzada</text>\n  </g>\n\n  <line x1=\"48\" y1=\"528\" x2=\"80\" y2=\"528\" stroke=\"#A0A8B8\" stroke-width=\"1.75\" stroke-dasharray=\"6 5\"/>\n  <text class=\"foot\" x=\"92\" y=\"528\" dy=\"0.35em\" data-fit=\"700\">Punteado: no hace falta para la sesión 1. Se configura en la sección Instalación avanzada.</text>\n</svg>",
  fiPasos: "<svg id=\"fiPasos\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 480\" width=\"880\" height=\"440\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"fiPasos-ttl fiPasos-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"fiPasos-ttl\">Instalar Flutter con la extensión</title>\n  <desc id=\"fiPasos-dsc\">Uno, instalar la extensión Flutter. Dos, abrir la paleta de comandos y elegir Flutter: New Project. Tres, pulsar Download SDK. Cuatro, elegir la carpeta y pulsar Clone Flutter. Cinco, pulsar Add SDK to PATH. Seis, abrir una terminal desde el menú Terminal.</desc>\n  <defs>\n    <style>\n      #fiPasos .card{fill:#FFFFFF;stroke:#D9DEE8;stroke-width:1.5}\n      #fiPasos .title{fill:#161A26;font-size:22px;font-weight:700}\n      #fiPasos .sub{fill:#79809A;font-size:13.5px}\n      #fiPasos .st{fill:#161A26;font-size:15px;font-weight:600}\n      #fiPasos .cap{fill:#454C61;font-size:13px}\n      #fiPasos .chip{fill:#FFFFFF;font-size:12px;font-weight:700}\n      #fiPasos .scr{fill:#1F2430}\n      #fiPasos .ui{fill:#D4D8E3;font-size:12px}\n      #fiPasos .dim{fill:#9AA3B5;font-size:11.5px}\n      #fiPasos .btn{fill:#0E639C}\n      #fiPasos .btn2{fill:#3A4254}\n      #fiPasos .bt{fill:#FFFFFF;font-size:11.5px;font-weight:600}\n      #fiPasos .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #fiPasos .ring{fill:none;stroke:#F2C069;stroke-width:2}\n    </style>\n  </defs>\n\n  <rect width=\"960\" height=\"616\" rx=\"16\" fill=\"#FFFFFF\"/>\n\n  <text class=\"title\" x=\"48\" y=\"56\">Instalar Flutter con la extensión</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Seis pasos dentro de VS Code. Los botones están en inglés: así los vas a ver en tu pantalla.</text>\n\n  <g transform=\"translate(48,112)\">\n    <rect class=\"card\" width=\"272\" height=\"216\" rx=\"12\"/>\n    <circle cx=\"28\" cy=\"32\" r=\"12\" fill=\"#4453C9\"/><text class=\"chip\" x=\"28\" y=\"32\" dy=\"0.35em\" text-anchor=\"middle\">1</text>\n    <text class=\"st\" x=\"48\" y=\"32\" dy=\"0.35em\" data-fit=\"208\">Instala la extensión</text>\n    <rect class=\"scr\" x=\"16\" y=\"56\" width=\"240\" height=\"96\" rx=\"8\"/>\n    <rect x=\"28\" y=\"66\" width=\"216\" height=\"22\" rx=\"4\" fill=\"#2A3040\"/>\n    <text class=\"ui mono\" x=\"36\" y=\"77\" dy=\"0.35em\" data-fit=\"200\">flutter</text>\n    <rect x=\"28\" y=\"100\" width=\"36\" height=\"36\" rx=\"6\" fill=\"#1E88E5\"/>\n    <text x=\"46\" y=\"118\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"18\" font-weight=\"700\">F</text>\n    <text x=\"74\" y=\"113\" fill=\"#FFFFFF\" font-size=\"13\" font-weight=\"700\" data-fit=\"100\">Flutter</text>\n    <text class=\"dim\" x=\"74\" y=\"130\" data-fit=\"100\">Dart Code</text>\n    <rect class=\"btn\" x=\"180\" y=\"108\" width=\"60\" height=\"22\" rx=\"4\"/>\n    <text class=\"bt\" x=\"210\" y=\"119\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"56\">Install</text>\n    <rect class=\"ring\" x=\"177\" y=\"105\" width=\"66\" height=\"28\" rx=\"6\"/>\n    <text class=\"cap\" x=\"16\" y=\"180\" data-fit=\"264\">Ctrl+Shift+X, busca «Flutter» e</text>\n    <text class=\"cap\" x=\"16\" y=\"198\" data-fit=\"264\">instala la que publica Dart Code.</text>\n  </g>\n\n  <g transform=\"translate(344,112)\">\n    <rect class=\"card\" width=\"272\" height=\"216\" rx=\"12\"/>\n    <circle cx=\"28\" cy=\"32\" r=\"12\" fill=\"#4453C9\"/><text class=\"chip\" x=\"28\" y=\"32\" dy=\"0.35em\" text-anchor=\"middle\">2</text>\n    <text class=\"st\" x=\"48\" y=\"32\" dy=\"0.35em\" data-fit=\"208\">Abre la paleta de comandos</text>\n    <rect class=\"scr\" x=\"16\" y=\"56\" width=\"240\" height=\"96\" rx=\"8\"/>\n    <rect x=\"28\" y=\"66\" width=\"216\" height=\"24\" rx=\"4\" fill=\"#2A3040\" stroke=\"#0E639C\" stroke-width=\"1.5\"/>\n    <text class=\"ui mono\" x=\"36\" y=\"78\" dy=\"0.35em\" data-fit=\"200\">&gt; flutter: new</text>\n    <rect x=\"28\" y=\"96\" width=\"216\" height=\"24\" fill=\"#04395E\"/>\n    <text x=\"36\" y=\"108\" dy=\"0.35em\" fill=\"#FFFFFF\" font-size=\"12\" data-fit=\"200\">Flutter: New Project</text>\n    <rect class=\"ring\" x=\"25\" y=\"93\" width=\"222\" height=\"30\" rx=\"4\"/>\n    <text class=\"dim\" x=\"36\" y=\"136\" dy=\"0.35em\" data-fit=\"200\">Flutter: Run Flutter Doctor</text>\n    <text class=\"cap\" x=\"16\" y=\"180\" data-fit=\"264\">Ctrl+Shift+P (Cmd+Shift+P en Mac)</text>\n    <text class=\"cap\" x=\"16\" y=\"198\" data-fit=\"264\">y elige Flutter: New Project.</text>\n  </g>\n\n  <g transform=\"translate(640,112)\">\n    <rect class=\"card\" width=\"272\" height=\"216\" rx=\"12\"/>\n    <circle cx=\"28\" cy=\"32\" r=\"12\" fill=\"#4453C9\"/><text class=\"chip\" x=\"28\" y=\"32\" dy=\"0.35em\" text-anchor=\"middle\">3</text>\n    <text class=\"st\" x=\"48\" y=\"32\" dy=\"0.35em\" data-fit=\"208\">Descarga el SDK</text>\n    <rect class=\"scr\" x=\"16\" y=\"56\" width=\"240\" height=\"96\" rx=\"8\"/>\n    <rect x=\"28\" y=\"66\" width=\"216\" height=\"76\" rx=\"6\" fill=\"#252B38\" stroke=\"#3A4254\"/>\n    <circle cx=\"44\" cy=\"84\" r=\"7\" fill=\"#3794FF\"/>\n    <text x=\"44\" y=\"84\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#1F2430\" font-size=\"10\" font-weight=\"700\">i</text>\n    <text x=\"58\" y=\"84\" dy=\"0.35em\" fill=\"#E6E9F0\" font-size=\"11.5\" data-fit=\"180\">Could not find a Flutter SDK.</text>\n    <rect class=\"btn\" x=\"40\" y=\"106\" width=\"104\" height=\"24\" rx=\"4\"/>\n    <text class=\"bt\" x=\"92\" y=\"118\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"112\">Download SDK</text>\n    <rect class=\"ring\" x=\"37\" y=\"103\" width=\"110\" height=\"30\" rx=\"6\"/>\n    <rect class=\"btn2\" x=\"154\" y=\"106\" width=\"80\" height=\"24\" rx=\"4\"/>\n    <text x=\"194\" y=\"118\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#D4D8E3\" font-size=\"11.5\" data-fit=\"76\">Locate SDK</text>\n    <text class=\"cap\" x=\"16\" y=\"180\" data-fit=\"264\">Si pregunta por una plantilla,</text>\n    <text class=\"cap\" x=\"16\" y=\"198\" data-fit=\"264\">presiona Esc: no la necesitas.</text>\n  </g>\n\n  <g transform=\"translate(48,352)\">\n    <rect class=\"card\" width=\"272\" height=\"216\" rx=\"12\"/>\n    <circle cx=\"28\" cy=\"32\" r=\"12\" fill=\"#4453C9\"/><text class=\"chip\" x=\"28\" y=\"32\" dy=\"0.35em\" text-anchor=\"middle\">4</text>\n    <text class=\"st\" x=\"48\" y=\"32\" dy=\"0.35em\" data-fit=\"208\">Elige la carpeta</text>\n    <rect class=\"scr\" x=\"16\" y=\"56\" width=\"240\" height=\"96\" rx=\"8\"/>\n    <text class=\"dim\" x=\"28\" y=\"76\" dy=\"0.35em\" data-fit=\"216\">Select Folder for Flutter SDK</text>\n    <rect x=\"28\" y=\"90\" width=\"216\" height=\"22\" rx=\"4\" fill=\"#2A3040\"/>\n    <text class=\"ui mono\" x=\"36\" y=\"101\" dy=\"0.35em\" data-fit=\"200\">C:\\develop</text>\n    <rect class=\"btn\" x=\"148\" y=\"120\" width=\"96\" height=\"24\" rx=\"4\"/>\n    <text class=\"bt\" x=\"196\" y=\"132\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"100\">Clone Flutter</text>\n    <rect class=\"ring\" x=\"145\" y=\"117\" width=\"102\" height=\"30\" rx=\"6\"/>\n    <text class=\"cap\" x=\"16\" y=\"180\" data-fit=\"264\">Ruta sin espacios, sin tildes y</text>\n    <text class=\"cap\" x=\"16\" y=\"198\" data-fit=\"264\">fuera de OneDrive.</text>\n  </g>\n\n  <g transform=\"translate(344,352)\">\n    <rect class=\"card\" width=\"272\" height=\"216\" rx=\"12\"/>\n    <circle cx=\"28\" cy=\"32\" r=\"12\" fill=\"#4453C9\"/><text class=\"chip\" x=\"28\" y=\"32\" dy=\"0.35em\" text-anchor=\"middle\">5</text>\n    <text class=\"st\" x=\"48\" y=\"32\" dy=\"0.35em\" data-fit=\"208\">Agrégalo al PATH</text>\n    <rect class=\"scr\" x=\"16\" y=\"56\" width=\"240\" height=\"96\" rx=\"8\"/>\n    <rect x=\"28\" y=\"66\" width=\"216\" height=\"76\" rx=\"6\" fill=\"#252B38\" stroke=\"#3A4254\"/>\n    <text x=\"40\" y=\"82\" dy=\"0.35em\" fill=\"#E6E9F0\" font-size=\"11.5\" data-fit=\"196\">Do you want to add the Flutter</text>\n    <text x=\"40\" y=\"97\" dy=\"0.35em\" fill=\"#E6E9F0\" font-size=\"11.5\" data-fit=\"196\">SDK to PATH...?</text>\n    <rect class=\"btn\" x=\"40\" y=\"110\" width=\"124\" height=\"24\" rx=\"4\"/>\n    <text class=\"bt\" x=\"102\" y=\"122\" dy=\"0.35em\" text-anchor=\"middle\" data-fit=\"130\">Add SDK to PATH</text>\n    <rect class=\"ring\" x=\"37\" y=\"107\" width=\"130\" height=\"30\" rx=\"6\"/>\n    <text class=\"cap\" x=\"16\" y=\"180\" data-fit=\"264\">Luego cierra y vuelve a abrir</text>\n    <text class=\"cap\" x=\"16\" y=\"198\" data-fit=\"264\">VS Code y las terminales.</text>\n  </g>\n\n  <g transform=\"translate(640,352)\">\n    <rect class=\"card\" width=\"272\" height=\"216\" rx=\"12\"/>\n    <circle cx=\"28\" cy=\"32\" r=\"12\" fill=\"#3A8235\"/><text class=\"chip\" x=\"28\" y=\"32\" dy=\"0.35em\" text-anchor=\"middle\">6</text>\n    <text class=\"st\" x=\"48\" y=\"32\" dy=\"0.35em\" data-fit=\"208\">Abre una terminal</text>\n    <rect class=\"scr\" x=\"16\" y=\"56\" width=\"240\" height=\"96\" rx=\"8\"/>\n    <text class=\"dim\" x=\"26\" y=\"70\" dy=\"0.35em\" font-size=\"11\" data-fit=\"60\">View</text>\n    <text class=\"dim\" x=\"60\" y=\"70\" dy=\"0.35em\" font-size=\"11\" data-fit=\"30\">Go</text>\n    <text class=\"dim\" x=\"84\" y=\"70\" dy=\"0.35em\" font-size=\"11\" data-fit=\"30\">Run</text>\n    <rect x=\"110\" y=\"61\" width=\"58\" height=\"18\" rx=\"3\" fill=\"#04395E\"/>\n    <text x=\"139\" y=\"70\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#FFFFFF\" font-size=\"11\" data-fit=\"54\">Terminal</text>\n    <rect x=\"110\" y=\"82\" width=\"136\" height=\"62\" rx=\"4\" fill=\"#252B38\" stroke=\"#3A4254\"/>\n    <rect x=\"114\" y=\"87\" width=\"128\" height=\"22\" rx=\"3\" fill=\"#04395E\"/>\n    <text x=\"122\" y=\"98\" dy=\"0.35em\" fill=\"#FFFFFF\" font-size=\"11.5\" data-fit=\"116\">New Terminal</text>\n    <rect class=\"ring\" x=\"111\" y=\"84\" width=\"134\" height=\"28\" rx=\"5\"/>\n    <text class=\"dim\" x=\"122\" y=\"126\" dy=\"0.35em\" font-size=\"11\" data-fit=\"116\">Split Terminal</text>\n    <text class=\"cap\" x=\"16\" y=\"180\" data-fit=\"264\">Terminal → New Terminal.</text>\n    <text class=\"cap\" x=\"16\" y=\"198\" data-fit=\"264\">Desde aquí sigue todo en consola.</text>\n  </g>\n\n  <rect x=\"48\" y=\"584\" width=\"14\" height=\"14\" rx=\"3\" fill=\"none\" stroke=\"#F2C069\" stroke-width=\"2\"/>\n  <text class=\"cap\" x=\"72\" y=\"591\" dy=\"0.35em\" fill=\"#79809A\" style=\"fill:#79809A;font-size:12px\" data-fit=\"700\">El recuadro amarillo marca dónde hacer clic en cada paso.</text>\n</svg>",
  iaAgente: "<svg id=\"iaAgente\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"48 112 864 424\" width=\"760\" height=\"373\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"iaAgente-ttl iaAgente-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"iaAgente-ttl\">Un agente en acción</title>\n  <desc id=\"iaAgente-dsc\">Sesión de un agente en consola: la persona pide agregar un botón que reinicie el contador; el agente lee y edita lib/main.dart, pide permiso para ejecutar flutter analyze, lo ejecuta y reporta lo que hizo.</desc>\n  <defs>\n    <style>\n      #iaAgente .title{fill:#161A26;font-size:22px;font-weight:700}\n      #iaAgente .sub{fill:#79809A;font-size:13.5px}\n      #iaAgente .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #iaAgente .tl{font-size:13px;fill:#C9CFDA;white-space:pre}\n      #iaAgente .pf{fill:#7F8AA3} #iaAgente .cmd{fill:#FFFFFF;font-weight:600}\n      #iaAgente .dim{fill:#8A93A6} #iaAgente .okk{fill:#6BCB77;font-weight:600}\n      #iaAgente .ring{fill:none;stroke:#F2C069;stroke-width:2}\n      #iaAgente .chipc{fill:#F2C069} #iaAgente .chipt{fill:#1F2430;font-size:11.5px;font-weight:700}\n      #iaAgente .ct{fill:#161A26;font-size:14px;font-weight:700}\n      #iaAgente .cb{fill:#454C61;font-size:13px}\n      #iaAgente .foot{fill:#79809A;font-size:12px}\n    </style>\n  </defs>\n  <rect width=\"960\" height=\"694\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Un agente en acción</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Así se ve una sesión en Claude Code, simplificada y en español. En OpenCode o Antigravity CLI el flujo es parecido.</text>\n  <rect x=\"48\" y=\"112\" width=\"864\" height=\"424\" rx=\"12\" fill=\"#1F2430\"/>\n  <path d=\"M48,124 A12,12 0 0 1 60,112 H900 A12,12 0 0 1 912,124 V144 H48 Z\" fill=\"#2A3040\"/>\n  <circle cx=\"68\" cy=\"128\" r=\"5\" fill=\"#F14C4C\"/><circle cx=\"84\" cy=\"128\" r=\"5\" fill=\"#E5C07B\"/><circle cx=\"100\" cy=\"128\" r=\"5\" fill=\"#6BCB77\"/>\n  <text x=\"480\" y=\"128\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#9AA3B5\" font-size=\"12\">Terminal · C:\\develop\\miapp1</text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"174\" data-fit=\"816\"><tspan class=\"pf\">miapp1&gt; </tspan><tspan class=\"cmd\">claude</tspan></text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"226\" data-fit=\"816\">&gt; Agrega un botón que reinicie el contador a cero</text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"278\" data-fit=\"816\">● Leer lib/main.dart</text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"304\" data-fit=\"816\">● Editar lib/main.dart   (+9 −1)</text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"356\" data-fit=\"816\">? ¿Permites ejecutar este comando?  flutter analyze</text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"382\" data-fit=\"816\">  1. Sí    2. Sí, y no volver a preguntar    3. No</text>\n  <text class=\"tl mono\" font-size=\"13\" x=\"72\" y=\"434\" data-fit=\"816\">● Ejecutar flutter analyze</text>\n  <text class=\"tl mono dim\" font-size=\"13\" x=\"72\" y=\"460\" data-fit=\"816\">  No issues found!</text>\n  <text class=\"tl mono okk\" font-size=\"13\" x=\"72\" y=\"512\" data-fit=\"816\">Listo: agregué un botón \"Reiniciar\" que vuelve el contador a 0.</text>\n  <rect class=\"ring\" x=\"68.0\" y=\"210\" width=\"390.2\" height=\"22\" rx=\"5\"/>\n  <circle class=\"chipc\" cx=\"458.2\" cy=\"211\" r=\"8\"/>\n  <text class=\"chipt\" x=\"458.2\" y=\"211\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"10.5\">1</text>\n  <rect class=\"ring\" x=\"68.0\" y=\"288\" width=\"179.6\" height=\"22\" rx=\"5\"/>\n  <circle class=\"chipc\" cx=\"247.6\" cy=\"289\" r=\"8\"/>\n  <text class=\"chipt\" x=\"247.6\" y=\"289\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"10.5\">2</text>\n  <rect class=\"ring\" x=\"83.6\" y=\"366\" width=\"382.4\" height=\"22\" rx=\"5\"/>\n  <circle class=\"chipc\" cx=\"466.0\" cy=\"367\" r=\"8\"/>\n  <text class=\"chipt\" x=\"466.0\" y=\"367\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"10.5\">3</text>\n  <g transform=\"translate(48.0,560)\">\n    <rect width=\"277.3\" height=\"102\" rx=\"12\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n    <circle class=\"chipc\" cx=\"26\" cy=\"26\" r=\"10\"/>\n    <text class=\"chipt\" x=\"26\" y=\"26\" dy=\"0.35em\" text-anchor=\"middle\">1</text>\n    <text class=\"ct\" x=\"46\" y=\"26\" dy=\"0.35em\" data-fit=\"215\">Tú pides</text>\n    <text class=\"cb\" x=\"16\" y=\"60\" data-fit=\"250\">En lenguaje natural: qué quieres,</text>\n    <text class=\"cb\" x=\"16\" y=\"79\" data-fit=\"245\">no cómo se escribe.</text>\n  </g>\n  <g transform=\"translate(341.3,560)\">\n    <rect width=\"277.3\" height=\"102\" rx=\"12\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n    <circle class=\"chipc\" cx=\"26\" cy=\"26\" r=\"10\"/>\n    <text class=\"chipt\" x=\"26\" y=\"26\" dy=\"0.35em\" text-anchor=\"middle\">2</text>\n    <text class=\"ct\" x=\"46\" y=\"26\" dy=\"0.35em\" data-fit=\"215\">La IA usa herramientas</text>\n    <text class=\"cb\" x=\"16\" y=\"60\" data-fit=\"245\">Lee y edita tus archivos. Cada</text>\n    <text class=\"cb\" x=\"16\" y=\"79\" data-fit=\"245\">acción queda a la vista.</text>\n  </g>\n  <g transform=\"translate(634.7,560)\">\n    <rect width=\"277.3\" height=\"102\" rx=\"12\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n    <circle class=\"chipc\" cx=\"26\" cy=\"26\" r=\"10\"/>\n    <text class=\"chipt\" x=\"26\" y=\"26\" dy=\"0.35em\" text-anchor=\"middle\">3</text>\n    <text class=\"ct\" x=\"46\" y=\"26\" dy=\"0.35em\" data-fit=\"215\">Tú autorizas</text>\n    <text class=\"cb\" x=\"16\" y=\"60\" data-fit=\"245\">Antes de ejecutar un comando</text>\n    <text class=\"cb\" x=\"16\" y=\"79\" data-fit=\"245\">pide permiso. Tú decides.</text>\n  </g>\n</svg>",

<script>
  // Arranque del deck (común a todas las presentaciones). Lo inserta scripts/build.py al final.
  document.getElementById('icesi-slides').innerHTML = (window.SLIDES || []).join('\n');
  icesi.init();

  window.addEventListener('load', () => setTimeout(() => Reveal.layout(), 300));
  let revealLayoutResizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(revealLayoutResizeTimeout);
    revealLayoutResizeTimeout = setTimeout(() => Reveal.layout(), 150);
  });

  var fsBtn = document.getElementById('fullscreen-btn');
  if (location.search.indexOf('print-pdf') !== -1) {
    fsBtn.style.display = 'none';
  } else {
    var toggleFullscreen = function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
      } else {
        document.exitFullscreen();
      }
    };
    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('keydown', function (e) {
      if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        toggleFullscreen();
      }
    });
  }
</script>
