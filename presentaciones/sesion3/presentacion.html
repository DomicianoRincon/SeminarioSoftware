  tpPantallas: "<svg id=\"tpPantallas\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"292 106 376 712\" width=\"239\" height=\"452\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"tpPantallas-ttl tpPantallas-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"tpPantallas-ttl\">La pantalla del taller</title>\n  <desc id=\"tpPantallas-dsc\">Un celular con la pantalla de perfil, dividida en cuatro bloques numerados de arriba hacia abajo. Uno, la información del perfil y sus tres indicadores. Dos, los botones Seguir y Enviar mensaje. Tres, los contactos sugeridos. Cuatro, las últimas conversaciones. Debajo, el nombre de la clase, ProfileScreen, y su ruta, /profile.</desc>\n  <defs>\n    <style>\n      #tpPantallas .title{fill:#161A26;font-size:22px;font-weight:700}\n      #tpPantallas .sub{fill:#79809A;font-size:13.5px}\n      #tpPantallas .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #tpPantallas .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #tpPantallas .nb{fill:#454C61;font-size:13px}\n      #tpPantallas .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #tpPantallas .foot{fill:#79809A;font-size:12px}\n      #tpPantallas .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #tpPantallas .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#tpPantallas-arrow)}\n    </style>\n    <marker id=\"tpPantallas-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"882\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">La pantalla del taller</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Se arma en cuatro bloques, de arriba hacia abajo, <script>
// Bloque 1 · Scaffold (slides 4 a 7). Fuente: lección S0020.
(function () {
  'use strict';
  var H = window.H, icesi = window.icesi, FIG = window.FIG;

  // 4 · Divisor
  window.SLIDES.push(icesi.sectionSlideEBlue(
    'Scaffold<br><small style="font-size:0.5em;">Toda pantalla empieza por el mismo widget.</small>'
  ));

  // 5 · Lo que le falta a un widget suelto
  window.SLIDES.push(H.withNotes(icesi.slideStandard('Lo que le falta a un widget suelto', FIG.sfSinScaffold),
    'La palabra Pantalla en rojo, con subrayado amarillo, sobre fondo negro: así se ve cualquier widget que se muestra sin nada alrededor. ' +
    'Scaffold es el andamio de la pantalla. Pone el fondo, hace que los textos tomen la letra y el color del tema, y reserva un lugar para cada parte.'));

  // 6 · Los lugares de un Scaffold
  window.SLIDES.push(H.withNotes(icesi.slideStandard('Los lugares de un Scaffold', FIG.sfPartes),
    'Cada propiedad es un lugar fijo de la pantalla, y ellos deciden qué widget va en cada uno. Todos son opcionales. El único que se usa siempre es body, que ocupa lo que dejan libre los demás. ' +
    'Si se quita appBar, el contenido sube hasta el borde de arriba; si se quita floatingActionButton, simplemente no hay botón. ' +
    'Hay un lugar más, bottomNavigationBar, que se ve en el tercer bloque de hoy.'));

  // 7 · Una pantalla es una Screen
  window.SLIDES.push(H.withNotes(icesi.slideStandard('Una pantalla es una Screen', FIG.sfScreen),
    'En este curso, lo que tiene Scaffold se llama Screen: es una pantalla entera, vive en lib/screens, su clase termina en Screen y se abre por su nombre en routes. ' +
    'Una Page es otra cosa: un pedazo de contenido sin Scaffold que una Screen muestra en su body. Aparece cuando una pantalla tiene secciones, en la sesión 9. Hasta entonces todo es una Screen. ' +
    'Aquí crean la segunda pantalla, ProfileScreen, que es el banco de pruebas de hoy: en cada bloque se le agrega algo y en el taller se termina.'));
})();
</script>
<script>

(function () {
  'use strict';
  var H = window.H, icesi = window.icesi, FIG = window.FIG;

  // 8 · Divisor
  window.SLIDES.push(icesi.sectionSlideEBlue(

  ));

  // 9 · La pantalla no es toda tuya
  window.SLIDES.push(H.withNotes(icesi.slideStandard('La pantalla no es toda tuya', FIG.saZonas),
    'Un Scaffold ocupa la pantalla entera, de borde a borde. El sistema dibuja encima la hora, la batería y la barra de gestos, y el teléfono recorta la pantalla con la cámara y las esquinas. ' +
    'Lo que la app ponga en esas zonas se pinta igual, pero queda tapado. Cada teléfono tiene zonas de distinto tamaño, así que no sirve dejar un espacio fijo: SafeArea le pregunta al teléfono cuánto miden.'));

  // 10 · Cuándo hace falta
  window.SLIDES.push(H.withNotes(icesi.slideStandard('Tres pantallas con el mismo contenido', FIG.saCasos),
    'Un AppBar ya sabe de la barra de estado: se estira hasta el borde y pone su título más abajo. Por eso en las pantallas con barra el problema de arriba no se nota. ' +

  // 11 · SafeArea envuelve el contenido
  window.SLIDES.push(H.withNotes(icesi.slideStandard('SafeArea envuelve el contenido', FIG.saCodigo),
    'SafeArea tiene un solo child: todo el contenido de la pantalla. Va dentro del Scaffold, en el body, no alrededor: por fuera, el fondo tampoco llega a los bordes y quedan dos franjas vacías. ' +
    'En Chrome no se nota, porque la ventana no tiene cámara ni barra de gestos. No se quita por eso: la app termina en un teléfono.'));

  // 12 · La regla del curso
  window.SLIDES.push(H.withNotes(icesi.sectionSlideEGreen(
    'La regla del curso<br><small style="font-size:0.5em;">El body de toda Screen empieza con un SafeArea.</small>'
  ), 'Si la pantalla tiene AppBar, SafeArea cuida el borde de abajo. Si no la tiene, cuida los dos. En ProfileScreen se envuelve ahora el Center del body.'));
})();
</script>
<script>
// Bloque 3 · Las dos barras (slides 13 a 16). Fuente: lecciones S0028 y S0027.
(function () {

  ));

  // 14 · Las partes de un AppBar
  window.SLIDES.push(H.withNotes(icesi.slideStandard('Las partes de un AppBar', FIG.abPartes),
    'title es el nombre de la pantalla y es el único que se pone siempre. actions es una lista: sus widgets se dibujan a la derecha en el orden en que se escriben; con más de tres, el título se queda sin espacio. ' +
    'leading recibe un solo widget y lo pone a la izquierda. Casi nunca se escribe: al llegar a una pantalla desde otra, Flutter pone ahí la flecha de volver por su cuenta. Eso es la sesión 8.'));

  // 15 · Centrar y colorear
  window.SLIDES.push(H.withNotes(icesi.slideStandard('La misma barra, con tres ajustes', FIG.abVariantes),
    'centerTitle en true lleva el título al centro. backgroundColor es el fondo de la barra y foregroundColor el color de lo que va encima: el título y los iconos. Van en pareja. ' +
    'El error típico: oscurecer el fondo sin cambiar foregroundColor, y el título queda oscuro sobre oscuro. ' +
    'En ProfileScreen centran el título y agregan en actions un IconButton con los tres puntos, como en el diseño del taller.'));

<script>
  // Arranque del deck (común a todas las presentaciones). Lo inserta scripts/build.py al final.
  document.getElementById('icesi-slides').innerHTML = (window.SLIDES || []).join('\n');
  icesi.init();

  window.addEventListener('load', () => setTimeout(() => Reveal.layout(), 300));
  let revealLayoutResizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(revealLayoutResizeTimeout);
    revealLayoutResizeTimeout = setTimeout(() => Reveal.layout(), 150);
  });

  var fsBtn = document.getElementById('fullscreen-btn');
  if (location.search.indexOf('print-pdf') !== -1) {
    fsBtn.style.display = 'none';
  } else {
    var toggleFullscreen = function () {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(function () {});
      } else {
        document.exitFullscreen();
      }
    };
    fsBtn.addEventListener('click', toggleFullscreen);
    document.addEventListener('keydown', function (e) {
      if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !e.altKey) {
        var tag = (document.activeElement && document.activeElement.tagName) || '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        toggleFullscreen();
      }
    });
  }
</script>
