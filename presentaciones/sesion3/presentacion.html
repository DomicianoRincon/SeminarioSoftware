:root {
  --icesi-blue: #5454E9;
  --icesi-green: #4CB979;
  --icesi-yellow: #E4EB60;
  --icesi-dark: #393939;
  --icesi-purple: #865CF0;
  --icesi-orange: #E9683B;
  --icesi-gray1: #88898C;
  --icesi-gray2: #CECFD4;
  --icesi-gray-1: #88898C;
  --icesi-gray-2: #CECFD4;
  --icesi-white: #FFFFFF;
  --slide-w: 1280px;
  --slide-h: 720px;
  --logo-top: 24px;
  --logo-left: 72px;
  --logo-w: 165px;
  --num-bottom: 60px;
  --num-lr: 72px;
}
.reveal {
  font-family: "Plus Jakarta Sans", sans-serif !important;
  color: var(--icesi-dark) !important;
}
.reveal .slides {
  text-align: left !important;
}
.reveal .slides > section {
  padding: 0 !important;
  margin: 0 !important;
}
.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: var(--slide-w) !important;
  height: var(--slide-h) !important;
  overflow: hidden;
  background: var(--icesi-white);
  box-sizing: border-box;
  font-family: "Plus Jakarta Sans", sans-serif;
  color: var(--icesi-dark);
}
.slide h1,
.slide h2,
.slide h3,
.slide h4,
.slide p,
.slide li,
.slide span,
.slide div {
  text-transform: none;
  letter-spacing: normal;
  text-shadow: none;
  font-family: "Plus Jakarta Sans", sans-serif;
  line-height: normal;
}
.slide .logo-lockup {
  position: absolute;
  top: var(--logo-top);
  left: var(--logo-left);
  display: flex;
  align-items: center;
  gap: 20px;
  z-index: 10;
}
.slide .logo-lockup .logo-icesi {
  width: var(--logo-w);
  height: auto;
  display: block;
}
.slide.sidebar-left .sidebar .logo-lockup {
  transform: scale(0.85);
  transform-origin: top left;
}
.slide .icesi-slide-number {
  position: absolute;
  bottom: var(--num-bottom);
  font-size: 10px;
  font-family: "Plus Jakarta Sans", sans-serif;
  font-weight: 400;
  z-index: 20;
  line-height: 1;
}
.slide .icesi-slide-number.right {
  right: var(--num-lr);
  left: auto;
}
.slide .icesi-slide-number.left {
  left: var(--num-lr);
  right: auto;
}
.slide.standard .slide-header,
.slide.two-cols .slide-header,
.slide.three-cols .slide-header,
.slide.four-cards .slide-header {
  position: absolute;
  left: 0;
  top: 0;
  width: 1280px;
  height: 220px;
}
.slide.standard .slide-header h2,
.slide.two-cols .slide-header h2,
.slide.three-cols .slide-header h2,
.slide.four-cards .slide-header h2 {
  position: absolute;
  left: 32px;
  top: 130px;
  width: 1194px;
  color: var(--icesi-blue);
  font-size: 38px;
  line-height: 46px;
  font-weight: 700;
  hyphens: none;
  margin: 0;
}
.slide .mermaid {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
.slide .mermaid svg {
  max-width: 100% !important;
  height: auto !important;
}
.slide.section-e.bg-blue .mermaid svg,
.slide.section-e.bg-green .mermaid svg,
.slide.section-e.bg-orange .mermaid svg,
.slide.title-a .mermaid svg,
.slide.section-c .mermaid svg {
  background: rgba(255, 255, 255, 0.90);
  border-radius: 10px;
  padding: 12px;
}
.slide.sidebar-left .sidebar .mermaid svg {
  background: rgba(255, 255, 255, 0.88);
  border-radius: 8px;
  padding: 8px;
  max-width: 340px !important;
}
.slide .slide-content h3,
.slide .col h3,
.slide .sidebar-content h3 {
  font-size: 22px;
  font-weight: 700;
  line-height: 28px;
  color: var(--icesi-blue);
  margin: 0 0 8px 0;
}
.slide .slide-content h4,
.slide .col h4,
.slide .sidebar-content h4 {
  font-size: 17px;
  font-weight: 700;
  line-height: 24px;
  color: var(--icesi-dark);
  margin: 6px 0 4px 0;
}
.slide .slide-content li,
.slide .col li,
.slide .sidebar-content li {
  font-size: 19px;
  line-height: 27px;
}
.slide .slide-content p,
.slide .col p,
.slide .sidebar-content p {
  margin-bottom: 10px;
  font-size: 19px;
  line-height: 27px;
}
.slide pre {
  background: #f4f4f8;
  border-left: 4px solid var(--icesi-blue);
  border-radius: 4px;
  padding: 12px 16px;
  font-size: 16px;
  line-height: 24px;
  overflow: auto;
  margin: 12px 0;
}
.slide code {
  font-family:
    "Consolas",
    "Fira Code",
    monospace;
  font-size: 0.9em;
  background: #f0f0f6;
  padding: 1px 5px;
  border-radius: 3px;
}
.slide pre code {
  background: transparent;
  padding: 0;
}
.slide .slide-content img,
.slide .col img {
  max-width: 100%;
  height: auto;
  display: block;
}
.text-blue {
  color: var(--icesi-blue) !important;
}
.text-green {
  color: var(--icesi-green) !important;
}
.text-orange {
  color: var(--icesi-orange) !important;
}
.text-purple {
  color: var(--icesi-purple) !important;
}
.text-dark {
  color: var(--icesi-dark) !important;
}
.slide strong,
.slide b {
  font-weight: 700;
}
.code-box {
  background: #1e1e2e;
  color: #cdd6f4;

  <style>
    /* Cuando la ventana no es exactamente 16:9 (o no está maximizada), Reveal centra
       el lienzo fijo de 1280x720 y deja franjas alrededor — con la ventana normal
       (no pantalla completa) esas franjas SIEMPRE van a aparecer, no hay forma de
       evitarlo sin distorsionar el contenido. Se fuerzan a un solo color oscuro
       consistente (nunca blanco: reveal.css fija su propio fondo en .reveal-viewport,
       a veces con más especificidad/inline, y un blanco que no cubre todo se ve peor
       — mezcla de blanco y negro — que un marco oscuro uniforme). */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0d14 !important; }
    .reveal, .reveal-viewport { background: #0d0d14 !important; }
    /* Reveal calcula el tamaño de la presentación con el offsetWidth/Height de
       .reveal (Y.wrapper), no con el de la ventana — y ese tamaño depende de
       heredar height:100% en cascada desde body/html. Cualquier desajuste ahí
       (fuentes pesadas cargando, clases que Reveal agrega de forma async, etc.)
       deja a .reveal más chico que la ventana real, y como el contenido se ancla
       arriba-izquierda dentro de esa caja, el sobrante se ve como franja negra
       abajo/derecha. Se sale de esa cadena de porcentajes fijando .reveal
       directo al viewport, igual que reveal.css hace para su propio :fullscreen. */
    .reveal {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    /* Reveal mantiene en el DOM las slides cercanas (past/future) con display:block
       para las transiciones — a ciertos ratios de ventana (fit exacto en un eje) se
       alcanza a ver un borde de la slide vecina. Ocultarlas por completo salvo la
       activa evita ese sangrado, sin depender del recorte por overflow. */
    .reveal .slides section:not(.present) { visibility: hidden !important; }
    /* Notas de orador (aside.notes) — nunca visibles en la vista principal, solo en
       la Vista de orador (tecla S). Reveal ya las oculta, esto es un respaldo. */
    .reveal .slides section aside.notes { display: none !important; }
    #fullscreen-btn {
      position: fixed; left: 18px; bottom: 14px; z-index: 50;
      display: flex; align-items: center; gap: 6px;
      padding: 7px 12px; border-radius: 20px; border: none; cursor: pointer;
      background: rgba(255,255,255,0.92); color: #5454E9;
      box-shadow: 0 1px 4px rgba(0,0,0,0.18);
      font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700;
      opacity: 0.7; transition: opacity .15s ease, background .15s ease;
    }
    #fullscreen-btn:hover { opacity: 1; background: #ffffff; }
    #fullscreen-btn svg { flex-shrink: 0; }
    :fullscreen #fullscreen-btn { display: none; }
      
  </style>

  function _logoLockup(icesiSrc, isDark) {
    return `<div class="logo-lockup"><img class="logo-icesi" src="${icesiSrc}" alt="Universidad Icesi"></div>`;
  }
  var state = {
    n: 0,
    logoNegFn: () => _logoLockup(LOGO_NEG, true),
    logoPosFn: () => _logoLockup(LOGO_POS, false)
  };
  function setN(val) {
    state.n = val;
  }
  function getN() {
    return state.n;
  }
  function setLogos(neg, pos) {
    state.logoNegFn = () => _logoLockup(neg, true);
    state.logoPosFn = () => _logoLockup(pos, false);
  }
  function _pageNum(color, side = "right", num) {
    const n = num !== void 0 ? num : state.n;
    const colorMap = {
      white: "#FFFFFF",
      blue: "#5454E9",
      dark: "#393939"
    };
    const c = colorMap[color] || color;
    return `<span class="icesi-slide-number ${side}" style="color:${c}">${n}</span>`;
  }
  function _section(className, content, numColor = "blue", numSide = "right") {
    state.n++;
    return `<section data-slide-index="${state.n}">
  <div class="slide ${className}">
${content}
${_pageNum(numColor, numSide, state.n)}
  </div>
</section>`;
  }

  // src/components/title-slides.js
  function titleSlideA(title, subtitle) {
    return _section("title-a", `
  ${state.logoNegFn()}
  <div class="title-box">
    <h1>${title}</h1>
  </div>
  <div class="subtitle-box">
    <p>${subtitle}</p>
  </div>
  `, "white", "right");
  }
  function titleSlideB(title, subtitle, footer, visual = "") {
    return _section("title-b", `
  ${state.logoPosFn()}
  ${visual}
  <div class="accent-bar"></div>
  <div class="slide-title">${title}</div>
  <div class="slide-subtitle">${subtitle}</div>
  <div class="slide-footer">${footer}</div>
  `, "blue", "left");
  }
  function titleSlideC(title, subtitle) {
    return _section("title-c", `
  ${state.logoPosFn()}
  <div class="blue-block"></div>
  <div class="stripe-pattern"></div>
  <div class="slide-title">${title}</div>
  <div class="slide-subtitle">${subtitle}</div>
  `, "white", "right");
  }

<script>
// Helpers genéricos para armar slides con la librería icesi (window.H).
// Extraídos de la presentación de la Sesión 5 de la microcredencial; sin íconos propios.
// Script plano (no ESM): se carga después de icesi-lib.js y antes de las slides.
// No usa emoji en ningún string; todo marcador va como SVG inline.

(function () {
  'use strict';

  function resize(svg, size) {
    return svg
      .replace(/width="\d+(\.\d+)?"/, 'width="' + size + '"')
      .replace(/height="\d+(\.\d+)?"/, 'height="' + size + '"');
  }

  // Registro de íconos propios del deck. Cada deck agrega los suyos en su helpers.js:
  //   Object.assign(window.H.ICONS, { miIcono: '<svg width="36" height="36" ...>...</svg>' });
  // Estilo: 36x36, círculo de color institucional + trazo blanco. Nunca emoji.
  var ICONS = {};

  // Reutiliza el set base de icesi.icons (check/alert/etc, 22x22) redimensionado a 36.
  function baseIcon(name, size) {
    var svg = window.icesi && window.icesi.icons && window.icesi.icons[name];
    if (!svg) return '';
    return resize(svg, size || 36);
  }

  function ul(items) {
    // items: [[svgIcon, htmlBody], ...]
    var lis = items.map(function (it) {
      return '<li style="display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;list-style:none;">' +
        '<span style="flex-shrink:0;margin-top:1px;width:26px;height:26px;">' + resize(it[0], 26) + '</span>' +
        '<span>' + it[1] + '</span></li>';
    }).join('');
    return '<ul style="list-style:none;padding-left:0;margin:0;">' + lis + '</ul>';
  }

  function plainUl(items) {
    // lista simple sin icono (para casos donde ya hay demasiados iconos en la slide)
    return '<ul>' + items.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>';
  }

  function iconCard(color, icon, title, body) {
    var cls = color ? ' ' + color : '';
    return '<div class="icon-card"><div class="icon-symbol' + cls + '">' + resize(icon, 24) + '</div>' +
      '<div class="icon-body"><strong>' + title + '</strong><span>' + body + '</span></div></div>';
  }

  function grid3(cards) { return '<div class="icon-grid-3">' + cards.join('') + '</div>'; }
  function grid2(cards) { return '<div class="icon-grid-2">' + cards.join('') + '</div>'; }

  function itemRow(icon, title, body) {
    return '<div class="item-row"><div class="item-icon">' + resize(icon, 40) + '</div>' +
      '<div class="item-text"><strong>' + title + '</strong>' + body + '</div></div>';
  }
  function evenly(rows) { return '<div class="items-evenly">' + rows.join('') + '</div>'; }

  function pre(text) {
    return '<pre style="white-space:pre-wrap;word-break:break-word;">' + text + '</pre>';
  }

  function table(headers, rows, compact) {
    var thStyle = compact ? ' style="padding:3px 10px;font-size:12.5px;line-height:15px;"' : '';
    var tdStyle = compact ? ' style="padding:2px 10px;font-size:12px;line-height:14px;"' : '';
    var th = headers.map(function (h) { return '<th' + thStyle + '>' + h + '</th>'; }).join('');
    var trs = rows.map(function (r) {
      return '<tr>' + r.map(function (c) { return '<td' + tdStyle + '>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    return '<table style="width:100%;max-width:100%;box-sizing:border-box;margin-top:' + (compact ? '6px' : '12px') + ';"><thead><tr>' + th + '</tr></thead><tbody>' + trs + '</tbody></table>';
  }

  function arrowRight(color) {
    color = color || '#5454E9';
    return '<svg width="26" height="16" viewBox="0 0 26 16"><line x1="1" y1="8" x2="19" y2="8" stroke="' + color + '" stroke-width="2"/><polyline points="15,3 22,8 15,13" stroke="' + color + '" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function flowNode(icon, label, sub, size) {
    size = size || 52;
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:' + (size + 78) + 'px;text-align:center;">' +
      '<div style="width:' + size + 'px;height:' + size + 'px;">' + resize(icon, size) + '</div>' +
      '<div style="font-size:15px;font-weight:700;color:#393939;">' + label + '</div>' +
      (sub ? '<div style="font-size:12px;color:#88898C;line-height:15px;">' + sub + '</div>' : '') +
      '</div>';
  }

  function pipeline(nodes, opts) {
    opts = opts || {};

      if (i < nodes.length - 1) parts.push('<div style="display:flex;align-items:center;padding-top:' + (size / 2 - 8) + 'px;">' + arrowRight(color) + '</div>');
    });
    return '<div style="display:flex;align-items:flex-start;justify-content:center;gap:2px;flex-wrap:wrap;">' + parts.join('') + '</div>';
  }

  // ─── Ventana / mockup de UI genérico (div+CSS, no SVG) ────────────
  function winChrome(title) {
    return '<div style="background:#E7E7EE;padding:7px 12px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #CECFD4;border-radius:10px 10px 0 0;">' +
      '<span style="width:9px;height:9px;border-radius:50%;background:#E9683B;display:inline-block;"></span>' +
      '<span style="width:9px;height:9px;border-radius:50%;background:#E4EB60;display:inline-block;"></span>' +
      '<span style="width:9px;height:9px;border-radius:50%;background:#4CB979;display:inline-block;"></span>' +
      '<span style="margin-left:8px;font-size:12px;color:#393939;font-weight:600;">' + title + '</span></div>';
  }

  function winMockup(opts) {
    var width = opts.width || '100%';
    var body = opts.body || '';
    var bg = opts.bg || '#FAFAFC';
    return '<div style="width:' + width + ';background:#fff;border:1px solid #CECFD4;border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,0.10);">' +
      winChrome(opts.title || '') +
      '<div style="padding:16px;background:' + bg + ';">' + body + '</div></div>';
  }

  function field(label, value, opts) {
    opts = opts || {};
    var border = opts.highlight ? '2px solid #4CB979' : '1px solid #CECFD4';
    return '<div style="margin-bottom:10px;">' +
      '<div style="font-size:12px;color:#88898C;margin-bottom:3px;">' + label + '</div>' +
      '<div style="border:' + border + ';border-radius:6px;padding:7px 10px;font-size:14px;color:#393939;background:#fff;">' + value + '</div></div>';
  }

  function checkbox(checked, label, highlight) {
    var box = checked
      ? '<span style="width:15px;height:15px;background:#4CB979;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;line-height:1;">&#10003;</span>'
      : '<span style="width:15px;height:15px;border:1.5px solid #CECFD4;border-radius:3px;display:inline-block;"></span>';
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;' + (highlight ? 'background:rgba(76,185,121,0.10);border-radius:5px;padding:3px 6px;' : '') + '">' +
      box + '<span style="font-size:13px;color:#393939;">' + label + '</span></div>';
  }

  function btn(text, color) {
    color = color || '#4CB979';
    return '<span style="display:inline-block;background:' + color + ';color:#fff;font-size:13px;font-weight:700;padding:7px 14px;border-radius:6px;">' + text + '</span>';
  }

  function pill(text, color, bg) {
    return '<span style="display:inline-block;font-size:12px;font-weight:700;color:' + color + ';background:' + bg + ';padding:3px 10px;border-radius:999px;">' + text + '</span>';
  }

  function withNotes(sectionHtml, notesHtml) {
    if (!notesHtml) return sectionHtml;
    return sectionHtml.replace('</section>', '<aside class="notes">' + notesHtml + '</aside>\n</section>');
  }

  window.H = {
    ICONS: ICONS, GIT: ICONS, resize: resize, baseIcon: baseIcon,
    ul: ul, plainUl: plainUl,
    iconCard: iconCard, grid3: grid3, grid2: grid2,
    itemRow: itemRow, evenly: evenly,
    pre: pre, table: table,
    arrowRight: arrowRight, flowNode: flowNode, pipeline: pipeline,
    winChrome: winChrome, winMockup: winMockup, field: field, checkbox: checkbox, btn: btn, pill: pill,
    withNotes: withNotes
  };
})();

  apRutas: "<svg id=\"apRutas\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"40 104 880 388.0\" width=\"975\" height=\"430\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"apRutas-ttl apRutas-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"apRutas-ttl\">Anotar la pantalla en main.dart</title>\n  <desc id=\"apRutas-dsc\">El archivo main.dart con tres líneas señaladas. El import trae el archivo de la pantalla. La entrada de routes le da un nombre, /profile, y dice qué pantalla se construye. initialRoute dice con cuál abre la app.</desc>\n  <defs>\n    <style>\n      #apRutas .title{fill:#161A26;font-size:22px;font-weight:700}\n      #apRutas .sub{fill:#79809A;font-size:13.5px}\n      #apRutas .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #apRutas .cl{font-size:13px;fill:#C9CFDA}\n      #apRutas .s{fill:#A8D8A0} #apRutas .n{fill:#F2B880} #apRutas .c{fill:#7FD1E8}\n      #apRutas .p{fill:#D5B8F5} #apRutas .k{fill:#F08FB0}\n      #apRutas .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #apRutas .ct{fill:#161A26;font-size:14px;font-weight:700}\n      #apRutas .cb{fill:#454C61;font-size:13px}\n      #apRutas .rt{fill:#161A26;font-size:14px} #apRutas .rs{fill:#79809A;font-size:12px}\n      #apRutas .foot{fill:#79809A;font-size:12px}\n      #apRutas .hl-amber{fill:#F2C069;fill-opacity:.16;stroke:#F2C069;stroke-width:1.5}\n      #apRutas .ld-amber{fill:none;stroke:#F2C069;stroke-width:1.5;stroke-dasharray:3 4}\n      #apRutas .ar-amber{fill:none;stroke:#A96C05;stroke-width:1.75;marker-end:url(#apRutas-ar-amber)}\n      #apRutas .hl-green{fill:#9FD68D;fill-opacity:.16;stroke:#9FD68D;stroke-width:1.5}\n      #apRutas .ld-green{fill:none;stroke:#9FD68D;stroke-width:1.5;stroke-dasharray:3 4}\n      #apRutas .ar-green{fill:none;stroke:#3A8235;stroke-width:1.75;marker-end:url(#apRutas-ar-green)}\n      #apRutas .hl-indigo{fill:#A9B4F2;fill-opacity:.16;stroke:#A9B4F2;stroke-width:1.5}\n      #apRutas .ld-indigo{fill:none;stroke:#A9B4F2;stroke-width:1.5;stroke-dasharray:3 4}\n      #apRutas .ar-indigo{fill:none;stroke:#4453C9;stroke-width:1.75;marker-end:url(#apRutas-ar-indigo)}\n    </style>\n    <marker id=\"apRutas-ar-amber\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#A96C05\"/></marker>\n    <marker id=\"apRutas-ar-green\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#3A8235\"/></marker>\n    <marker id=\"apRutas-ar-indigo\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#4453C9\"/></marker>\n  </defs>\n  <rect width=\"960\" height=\"516\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Anotar la pantalla en <tspan class=\"mono\">main.dart</tspan></text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Tres líneas. Sin ellas la pantalla existe, pero la app no sabe llegar a ella.</text>\n  <rect x=\"48\" y=\"112\" width=\"456\" height=\"372\" rx=\"12\" fill=\"#1F2430\"/>\n  <path d=\"M48,124 A12,12 0 0 1 60,112 H492 A12,12 0 0 1 504,124 V144 H48 Z\" fill=\"#2A3040\"/>\n  <circle cx=\"68\" cy=\"128\" r=\"5\" fill=\"#F14C4C\"/><circle cx=\"84\" cy=\"128\" r=\"5\" fill=\"#E5C07B\"/><circle cx=\"100\" cy=\"128\" r=\"5\" fill=\"#6BCB77\"/>\n  <text class=\"mono\" x=\"276\" y=\"128\" dy=\"0.35em\" text-anchor=\"middle\" fill=\"#9AA3B5\" font-size=\"12\" data-fit=\"316\">lib/main.dart</text>\n  <rect x=\"552\" y=\"112\" width=\"360\" height=\"372\" rx=\"12\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <text class=\"h\" x=\"568\" y=\"128\" dy=\"0.35em\" data-fit=\"328\">QUÉ HACE CADA LÍNEA</text>\n  <path d=\"M552,144 H912\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <rect class=\"hl-indigo\" x=\"305.8\" y=\"180\" width=\"156.2\" height=\"22\" rx=\"5\"/>\n  <rect class=\"hl-green\" x=\"79.6\" y=\"276\" width=\"101.6\" height=\"22\" rx=\"5\"/>\n  <rect class=\"hl-amber\" x=\"95.2\" y=\"324\" width=\"86.0\" height=\"22\" rx=\"5\"/>\n  <text class=\"cl mono\" font-size=\"13\" x=\"68.0\" y=\"172\" textLength=\"304.2\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"k\">import</tspan> <tspan class=\"s\">'package:flutter/material.dart'</tspan>;</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"68.0\" y=\"196\" textLength=\"405.6\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"k\">import</tspan> <tspan class=\"s\">'package:miapp1/screens/profile_screen.dart'</tspan>;</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"68.0\" y=\"244\" textLength=\"148.2\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"k\">return</tspan> <tspan class=\"c\">MaterialApp</tspan>(</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"83.6\" y=\"268\" textLength=\"124.8\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"p\">title</tspan>: <tspan class=\"s\">'Mi app'</tspan>,</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"83.6\" y=\"292\" textLength=\"195.0\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"p\">initialRoute</tspan>: <tspan class=\"s\">'/profile'</tspan>,</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"83.6\" y=\"316\" textLength=\"70.2\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"p\">routes</tspan>: {</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"99.2\" y=\"340\" textLength=\"366.6\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\"><tspan class=\"s\">'/profile'</tspan>: (context) =&gt; <tspan class=\"k\">const</tspan> <tspan class=\"c\">ProfileScreen</tspan>(),</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"83.6\" y=\"364\" textLength=\"15.6\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\">},</text>\n  <text class=\"cl mono\" font-size=\"13\" x=\"68.0\" y=\"388\" textLength=\"15.6\" lengthAdjust=\"spacingAndGlyphs\" data-fit=\"432\">);</text>\n  <g transform=\"translate(552,144)\">\n<g transform=\"translate(16,16)\"><rect width=\"328\" height=\"76\" rx=\"10\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/><text x=\"14\" y=\"23\" font-size=\"13.5\" font-weight=\"700\" fill=\"#4453C9\" data-fit=\"300\">El import</text><text x=\"14\" y=\"43\" font-size=\"12.5\" fill=\"#454C61\" data-fit=\"300\">Trae el archivo de la pantalla.</text><text x=\"14\" y=\"60\" font-size=\"12.5\" fill=\"#454C61\" data-fit=\"300\">Sin él, main.dart no la conoce.</text></g><g transform=\"translate(16,124)\"><rect width=\"328\" height=\"76\" rx=\"10\" fill=\"#E8F6E3\" stroke=\"#9FD68D\" stroke-width=\"1.5\"/><text x=\"14\" y=\"23\" font-size=\"13.5\" font-weight=\"700\" fill=\"#3A8235\" data-fit=\"300\">initialRoute</text><text x=\"14\" y=\"43\" font-size=\"12.5\" fill=\"#454C61\" data-fit=\"300\">La pantalla con la que abre la app.</text><text x=\"14\" y=\"60\" font-size=\"12.5\" fill=\"#454C61\" data-fit=\"300\">Tiene que ser un nombre de routes.</text></g><g transform=\"translate(16,232)\"><rect width=\"328\" height=\"76\" rx=\"10\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\"/><text x=\"14\" y=\"23\" font-size=\"13.5\" font-weight=\"700\" fill=\"#A96C05\" data-fit=\"300\">La entrada de routes</text><text x=\"14\" y=\"43\" font-size=\"12.5\" fill=\"#454C61\" data-fit=\"300\">Un nombre que empieza con /</text><text x=\"14\" y=\"60\" font-size=\"12.5\" fill=\"#454C61\" data-fit=\"300\">y la pantalla que se construye.</text></g>\n  </g>\n  <path class=\"ld-indigo\" d=\"M479.6,191 H504\"/>\n  <path class=\"ar-indigo\" d=\"M504,191 H514 V198 H568\"/>\n  <path class=\"ld-green\" d=\"M284.6,287 H504\"/>\n  <path class=\"ar-green\" d=\"M504,287 H523 V306 H568\"/>\n  <path class=\"ld-amber\" d=\"M471.8,335 H504\"/>\n  <path class=\"ar-amber\" d=\"M504,335 H532 V414 H568\"/>\n</svg>",
  sfSinScaffold: "<svg id=\"sfSinScaffold\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 464.0\" width=\"890\" height=\"430\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"sfSinScaffold-ttl sfSinScaffold-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"sfSinScaffold-ttl\">El mismo Text, sin y con Scaffold</title>\n  <desc id=\"sfSinScaffold-dsc\">Dos celulares. En el de la izquierda, un Text suelto: letras rojas con subrayado amarillo sobre fondo negro. En el de la derecha, el mismo texto dentro de un Scaffold: fondo claro, una barra con el título Inicio y el texto en el centro.</desc>\n  <defs>\n    <style>\n      #sfSinScaffold .title{fill:#161A26;font-size:22px;font-weight:700}\n      #sfSinScaffold .sub{fill:#79809A;font-size:13.5px}\n      #sfSinScaffold .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #sfSinScaffold .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #sfSinScaffold .nb{fill:#454C61;font-size:13px}\n      #sfSinScaffold .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #sfSinScaffold .foot{fill:#79809A;font-size:12px}\n      #sfSinScaffold .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #sfSinScaffold .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#sfSinScaffold-arrow)}\n    </style>\n    <marker id=\"sfSinScaffold-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"560\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">El mismo <tspan class=\"mono\">Text</tspan>, sin y con <tspan class=\"mono\">Scaffold</tspan></text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Un texto suelto no es una pantalla. Scaffold le pone el fondo, el estilo y un lugar a cada parte.</text>\n  <clipPath id=\"sfSinScaffold-a\"><rect width=\"220\" height=\"330\" rx=\"20\"/></clipPath><rect x=\"143\" y=\"125\" width=\"234\" height=\"344\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(150,132)\"><g clip-path=\"url(#sfSinScaffold-a)\"><rect width=\"220\" height=\"330\" rx=\"20\" fill=\"#000000\"/><text x=\"14\" y=\"40\" font-size=\"26\" font-weight=\"400\" fill=\"#E53935\">Pantalla</text><path d=\"M14,46 H112 M14,50 H112\" stroke=\"#FFEB3B\" stroke-width=\"1.5\"/></g></g>\n  <clipPath id=\"sfSinScaffold-b\"><rect width=\"220\" height=\"330\" rx=\"20\"/></clipPath><rect x=\"583\" y=\"125\" width=\"234\" height=\"344\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(590,132)\"><g clip-path=\"url(#sfSinScaffold-b)\"><rect width=\"220\" height=\"330\" rx=\"20\" fill=\"#FFFFFF\"/><rect width=\"220\" height=\"52\" fill=\"#F1ECF8\"/><text x=\"18\" y=\"31\" font-size=\"17\" font-weight=\"500\" fill=\"#161A26\" text-anchor=\"start\">Inicio</text><text x=\"110\" y=\"196\" font-size=\"14\" font-weight=\"400\" fill=\"#161A26\" text-anchor=\"middle\">Pantalla</text></g></g>\n  <path class=\"link\" d=\"M400,297 H560\"/>\n  <text x=\"480\" y=\"285\" font-size=\"12.5\" font-weight=\"600\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"150\">dentro de un Scaffold</text>\n  <text x=\"260\" y=\"502\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"middle\">Un Text suelto</text>\n  <text x=\"260\" y=\"524\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"330\">Sin fondo, sin estilo de letra, sin barra.</text>\n  <text x=\"700\" y=\"502\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"middle\" data-fit=\"380\">El mismo Text en el body de un Scaffold</text>\n  <text x=\"700\" y=\"524\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"330\">Fondo, letra del tema y barra con título.</text>\n</svg>",
  sfScreen: "<svg id=\"sfScreen\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 404.0\" width=\"1022\" height=\"430\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"sfScreen-ttl sfScreen-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"sfScreen-ttl\">Screen y Page</title>\n  <desc id=\"sfScreen-dsc\">Dos celulares. El de la izquierda es una Screen: un Scaffold completo, con su barra y su contenido, en lib/screens. El de la derecha muestra una Page: solo la zona de contenido, sin Scaffold, dentro de una Screen que tiene una barra de navegación abajo; vive en lib/pages y se ve en la sesión 9.</desc>\n  <defs>\n    <style>\n      #sfScreen .title{fill:#161A26;font-size:22px;font-weight:700}\n      #sfScreen .sub{fill:#79809A;font-size:13.5px}\n      #sfScreen .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #sfScreen .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #sfScreen .nb{fill:#454C61;font-size:13px}\n      #sfScreen .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #sfScreen .foot{fill:#79809A;font-size:12px}\n      #sfScreen .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #sfScreen .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#sfScreen-arrow)}\n    </style>\n    <marker id=\"sfScreen-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"500\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Screen y Page</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Si tiene Scaffold, es una Screen. Una Page es un pedazo de pantalla que una Screen hospeda.</text>\n  <clipPath id=\"sfScreen-a\"><rect width=\"180\" height=\"300\" rx=\"20\"/></clipPath><rect x=\"81\" y=\"129\" width=\"194\" height=\"314\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(88,136)\"><g clip-path=\"url(#sfScreen-a)\"><rect width=\"180\" height=\"300\" rx=\"20\" fill=\"#FFFFFF\"/><rect width=\"180\" height=\"44\" fill=\"#F1ECF8\"/><text x=\"16\" y=\"27\" font-size=\"15\" font-weight=\"500\" fill=\"#161A26\" text-anchor=\"start\">Perfil</text><rect x=\"20\" y=\"70\" width=\"140\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"92\" width=\"110\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"114\" width=\"126\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"160\" width=\"140\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"182\" width=\"90\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"3\" y=\"3\" width=\"174\" height=\"294\" rx=\"18\" fill=\"#4453C9\" fill-opacity=\".08\" stroke=\"#4453C9\" stroke-width=\"2\"/></g></g>\n  <clipPath id=\"sfScreen-b\"><rect width=\"180\" height=\"300\" rx=\"20\"/></clipPath><rect x=\"529\" y=\"129\" width=\"194\" height=\"314\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(536,136)\"><g clip-path=\"url(#sfScreen-b)\"><rect width=\"180\" height=\"300\" rx=\"20\" fill=\"#FFFFFF\"/><rect width=\"180\" height=\"44\" fill=\"#F1ECF8\"/><text x=\"16\" y=\"27\" font-size=\"15\" font-weight=\"500\" fill=\"#161A26\" text-anchor=\"start\">Inicio</text><rect y=\"252\" width=\"180\" height=\"48\" fill=\"#F1ECF8\"/><circle cx=\"36\" cy=\"276\" r=\"7\" fill=\"#7439B8\"/><circle cx=\"90\" cy=\"276\" r=\"7\" fill=\"#C4CBD8\"/><circle cx=\"144\" cy=\"276\" r=\"7\" fill=\"#C4CBD8\"/><rect x=\"20\" y=\"70\" width=\"140\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"92\" width=\"110\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"114\" width=\"126\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"160\" width=\"140\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"20\" y=\"182\" width=\"90\" height=\"10\" rx=\"5\" fill=\"#D9DEE8\"/><rect x=\"6\" y=\"50\" width=\"168\" height=\"196\" rx=\"10\" fill=\"#0F8478\" fill-opacity=\".08\" stroke=\"#0F8478\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/></g></g>\n  <text x=\"300\" y=\"152\" font-size=\"17\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"start\" class=\"mono\" data-fit=\"180\">ProfileScreen</text>\n  <text x=\"300\" y=\"176\" font-size=\"12.5\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" class=\"mono\" data-fit=\"180\">lib/screens/</text>\n  <text x=\"300\" y=\"222\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"180\">Tiene Scaffold</text>\n  <text x=\"300\" y=\"242\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"180\">Es la pantalla entera.</text>\n  <text x=\"300\" y=\"284\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"180\">Se abre por su ruta</text>\n  <text x=\"300\" y=\"304\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"180\">Está en routes.</text>\n  <text x=\"300\" y=\"346\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"180\">Desde hoy</text>\n  <text x=\"300\" y=\"366\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"180\">Todas tus pantallas.</text>\n  <text x=\"748\" y=\"152\" font-size=\"17\" font-weight=\"700\" fill=\"#0F8478\" text-anchor=\"start\" class=\"mono\" data-fit=\"180\">FeedPage</text>\n  <text x=\"748\" y=\"176\" font-size=\"12.5\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" class=\"mono\" data-fit=\"180\">lib/pages/</text>\n  <text x=\"748\" y=\"222\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"180\">No tiene Scaffold</text>\n  <text x=\"748\" y=\"242\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"180\">Solo el contenido.</text>\n  <text x=\"748\" y=\"284\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"180\">La hospeda una Screen</text>\n  <text x=\"748\" y=\"304\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"180\">No tiene ruta propia.</text>\n  <text x=\"748\" y=\"346\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"180\">Sesión 9</text>\n  <text x=\"748\" y=\"366\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"180\">Con la barra de abajo.</text>\n  <path d=\"M480,128 V444\" stroke=\"#D9DEE8\" stroke-width=\"1.5\" stroke-dasharray=\"4 5\"/>\n</svg>",
  saZonas: "<svg id=\"saZonas\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 444.0\" width=\"930\" height=\"430\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"saZonas-ttl saZonas-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"saZonas-ttl\">La pantalla no es toda tuya</title>\n  <desc id=\"saZonas-dsc\">Un celular con tres zonas marcadas. Arriba, la barra de estado con la hora, la batería y el recorte de la cámara. Abajo, la barra de gestos. En medio, la zona segura, donde todo se ve y se puede tocar.</desc>\n  <defs>\n    <style>\n      #saZonas .title{fill:#161A26;font-size:22px;font-weight:700}\n      #saZonas .sub{fill:#79809A;font-size:13.5px}\n      #saZonas .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #saZonas .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #saZonas .nb{fill:#454C61;font-size:13px}\n      #saZonas .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #saZonas .foot{fill:#79809A;font-size:12px}\n      #saZonas .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #saZonas .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#saZonas-arrow)}\n    </style>\n    <marker id=\"saZonas-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"540\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">La pantalla no es toda tuya</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">El sistema dibuja encima de la app en los bordes. Lo que pongas ahí queda tapado.</text>\n  <clipPath id=\"saZonas-a\"><rect width=\"220\" height=\"344\" rx=\"20\"/></clipPath><rect x=\"129\" y=\"125\" width=\"234\" height=\"358\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(136,132)\"><g clip-path=\"url(#saZonas-a)\"><rect width=\"220\" height=\"344\" rx=\"20\" fill=\"#FFFFFF\"/><rect y=\"0\" width=\"220\" height=\"36\" fill=\"#C2354F\" fill-opacity=\".13\"/><rect y=\"36\" width=\"220\" height=\"284\" fill=\"#3A8235\" fill-opacity=\".13\"/><rect y=\"320\" width=\"220\" height=\"24\" fill=\"#C2354F\" fill-opacity=\".13\"/><path d=\"M0,36 H220 M0,320 H220\" stroke=\"#FFFFFF\" stroke-width=\"2\"/><text x=\"110.0\" y=\"177.0\" font-size=\"15\" font-weight=\"700\" fill=\"#3A8235\" text-anchor=\"middle\">Zona segura</text><text x=\"16\" y=\"22\" font-size=\"11.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\">9:41</text><rect x=\"78.0\" y=\"7\" width=\"64\" height=\"18\" rx=\"9\" fill=\"#1F2430\"/><rect x=\"182\" y=\"11\" width=\"22\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"#161A26\" stroke-width=\"1.5\"/><rect x=\"184\" y=\"13\" width=\"13\" height=\"7\" rx=\"1.5\" fill=\"#161A26\"/><rect x=\"74.0\" y=\"332\" width=\"72\" height=\"5\" rx=\"2.5\" fill=\"#1F2430\"/></g></g>\n  <path d=\"M366,150 H432\" stroke=\"#C2354F\" stroke-width=\"1.75\"/><circle cx=\"366\" cy=\"150\" r=\"3.5\" fill=\"#C2354F\"/>\n  <text x=\"448\" y=\"146\" font-size=\"15\" font-weight=\"700\" fill=\"#C2354F\" text-anchor=\"start\" data-fit=\"440\">Barra de estado y cámara</text>\n  <text x=\"448\" y=\"167\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"440\">La hora, la batería y el recorte de la cámara.</text>\n  <path d=\"M366,304 H432\" stroke=\"#3A8235\" stroke-width=\"1.75\"/><circle cx=\"366\" cy=\"304\" r=\"3.5\" fill=\"#3A8235\"/>\n  <text x=\"448\" y=\"300\" font-size=\"15\" font-weight=\"700\" fill=\"#3A8235\" text-anchor=\"start\" data-fit=\"440\">Zona segura</text>\n  <text x=\"448\" y=\"321\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"440\">Aquí todo se ve completo y se puede tocar.</text>\n  <path d=\"M366,464 H432\" stroke=\"#C2354F\" stroke-width=\"1.75\"/><circle cx=\"366\" cy=\"464\" r=\"3.5\" fill=\"#C2354F\"/>\n  <text x=\"448\" y=\"460\" font-size=\"15\" font-weight=\"700\" fill=\"#C2354F\" text-anchor=\"start\" data-fit=\"440\">Barra de gestos</text>\n  <text x=\"448\" y=\"481\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"440\">La raya para volver al inicio del teléfono.</text>\n  <text x=\"448\" y=\"238\" font-size=\"13\" font-weight=\"400\" fill=\"#79809A\" text-anchor=\"start\" data-fit=\"440\">Las esquinas redondeadas también recortan.</text>\n</svg>",
  saCasos: "<svg id=\"saCasos\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 460.0\" width=\"897\" height=\"430\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"saCasos-ttl saCasos-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"saCasos-ttl\">Tres pantallas con el mismo contenido</title>\n  <desc id=\"saCasos-dsc\">Tres celulares con un título arriba y un botón abajo. En el primero, sin AppBar ni SafeArea, la cámara tapa el título y la barra de gestos queda encima del botón. En el segundo, con AppBar, el título ya se ve pero el botón sigue tapado. En el tercero, con SafeArea, todo queda dentro de la zona segura.</desc>\n  <defs>\n    <style>\n      #saCasos .title{fill:#161A26;font-size:22px;font-weight:700}\n      #saCasos .sub{fill:#79809A;font-size:13.5px}\n      #saCasos .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #saCasos .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #saCasos .nb{fill:#454C61;font-size:13px}\n      #saCasos .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #saCasos .foot{fill:#79809A;font-size:12px}\n      #saCasos .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #saCasos .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#saCasos-arrow)}\n    </style>\n    <marker id=\"saCasos-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"556\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Tres pantallas con el mismo contenido</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Un título arriba y un botón abajo. Lo que cambia es qué los protege de los bordes.</text>\n  <clipPath id=\"saCasos-0\"><rect width=\"200\" height=\"300\" rx=\"20\"/></clipPath><rect x=\"73\" y=\"125\" width=\"214\" height=\"314\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(80,132)\"><g clip-path=\"url(#saCasos-0)\"><rect width=\"200\" height=\"300\" rx=\"20\" fill=\"#FFFFFF\"/><text x=\"100.0\" y=\"26\" font-size=\"20\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"middle\">Bienvenido</text><text x=\"100.0\" y=\"48\" font-size=\"12\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\">Inicia sesión para continuar</text><rect x=\"16\" y=\"260\" width=\"168\" height=\"40\" rx=\"20\" fill=\"#2196F3\"/><text x=\"100.0\" y=\"285\" font-size=\"14\" font-weight=\"600\" fill=\"#FFFFFF\" text-anchor=\"middle\">Entrar</text><text x=\"16\" y=\"22\" font-size=\"11.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\">9:41</text><rect x=\"68.0\" y=\"7\" width=\"64\" height=\"18\" rx=\"9\" fill=\"#1F2430\"/><rect x=\"162\" y=\"11\" width=\"22\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"#161A26\" stroke-width=\"1.5\"/><rect x=\"164\" y=\"13\" width=\"13\" height=\"7\" rx=\"1.5\" fill=\"#161A26\"/><rect x=\"64.0\" y=\"288\" width=\"72\" height=\"5\" rx=\"2.5\" fill=\"#1F2430\"/></g></g>\n  <text x=\"180.0\" y=\"476\" font-size=\"15\" font-weight=\"700\" fill=\"#C2354F\" text-anchor=\"middle\" data-fit=\"280\">Sin AppBar ni SafeArea</text>\n  <text x=\"180.0\" y=\"498\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"280\">La cámara tapa el título</text>\n  <text x=\"180.0\" y=\"516\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"280\">y los gestos, el botón.</text>\n  <clipPath id=\"saCasos-1\"><rect width=\"200\" height=\"300\" rx=\"20\"/></clipPath><rect x=\"373\" y=\"125\" width=\"214\" height=\"314\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(380,132)\"><g clip-path=\"url(#saCasos-1)\"><rect width=\"200\" height=\"300\" rx=\"20\" fill=\"#FFFFFF\"/><rect width=\"20 ize=\"12\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\">Inicia sesión para continuar</text><rect x=\"16\" y=\"236\" width=\"168\" height=\"40\" rx=\"20\" fill=\"#2196F3\"/><text x=\"100.0\" y=\"261\" font-size=\"14\" font-weight=\"600\" fill=\"#FFFFFF\" text-anchor=\"middle\">Entrar</text><text x=\"16\" y=\"22\" font-size=\"11.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\">9:41</text><rect x=\"68.0\" y=\"7\" width=\"64\" height=\"18\" rx=\"9\" fill=\"#1F2430\"/><rect x=\"162\" y=\"11\" width=\"22\" height=\"11\" rx=\"3\" fill=\"none\" stroke=\"#161A26\" stroke-width=\"1.5\"/><rect x=\"164\" y=\"13\" width=\"13\" height=\"7\" rx=\"1.5\" fill=\"#161A26\"/><rect x=\"64.0\" y=\"288\" width=\"72\" height=\"5\" rx=\"2.5\" fill=\"#1F2430\"/></g></g>\n  <text x=\"780.0\" y=\"476\" font-size=\"15\" font-weight=\"700\" fill=\"#3A8235\" text-anchor=\"middle\" data-fit=\"280\">Con SafeArea</text>\n  <text x=\"780.0\" y=\"498\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"280\">Todo queda dentro</text>\n  <text x=\"780.0\" y=\"516\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"middle\" data-fit=\"280\">de la zona segura.</text>\n</svg>",
  abPartes: "<svg id=\"abPartes\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 316.0\" width=\"1215\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"abPartes-ttl abPartes-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"abPartes-ttl\">Las partes de un AppBar</title>\n  <desc id=\"abPartes-dsc\">La parte de arriba de un celular con una barra. A la izquierda, un botón de menú: es leading. Después, el título Perfil: es title. A la derecha, dos botones, buscar y ajustes: son actions.</desc>\n  <defs>\n    <style>\n      #abPartes .title{fill:#161A26;font-size:22px;font-weight:700}\n      #abPartes .sub{fill:#79809A;font-size:13.5px}\n      #abPartes .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #abPartes .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #abPartes .nb{fill:#454C61;font-size:13px}\n      #abPartes .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #abPartes .foot{fill:#79809A;font-size:12px}\n      #abPartes .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #abPartes .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#abPartes-arrow)}\n    </style>\n    <marker id=\"abPartes-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"412\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Las partes de un <tspan class=\"mono\">AppBar</tspan></text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Tres lugares, de izquierda a derecha. Solo title es de uso diario; los otros dos son opcionales.</text>\n  <clipPath id=\"abPartes-ac\"><rect x=\"250\" y=\"218\" width=\"460\" height=\"160\"/></clipPath><line   abVariantes: "<svg id=\"abVariantes\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 276.0\" width=\"1216\" height=\"350\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"abVariantes-ttl abVariantes-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"abVariantes-ttl\">La misma barra, con tres ajustes</title>\n  <desc id=\"abVariantes-dsc\">Tres barras con el mismo título y los mismos botones. La primera, sin ajustes: el título queda a la izquierda. La segunda, con centerTitle en true: el título queda centrado. La tercera, con backgroundColor morado y foregroundColor blanco: fondo oscuro con el título y los iconos en blanco.</desc>\n  <defs>\n    <style>\n      #abVariantes .title{fill:#161A26;font-size:22px;font-weight:700}\n      #abVariantes .sub{fill:#79809A;font-size:13.5px}\n      #abVariantes .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #abVariantes .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #abVariantes .nb{fill:#454C61;font-size:13px}\n      #abVariantes .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #abVariantes .foot{fill:#79809A;font-size:12px}\n      #abVariantes .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #abVariantes .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#abVariantes-arrow)}\n    </style>\n    <marker id=\"abVariantes-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"372\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">La misma barra, con tres ajustes</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">El contenido no cambia. Cambian dónde queda el título y de qué color   cpInsets: "<svg id=\"cpInsets\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 312.0\" width=\"1216\" height=\"395\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"cpInsets-ttl cpInsets-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"cpInsets-ttl\">Tres formas de decir cuánto aire</title>\n  <desc id=\"cpInsets-dsc\">Tres cajas. En la primera, EdgeInsets.all(16) deja el mismo espacio por los cuatro lados. En la segunda, EdgeInsets.symmetric deja 24 a los lados y 8 arriba y abajo. En la tercera, EdgeInsets.only deja espacio solo arriba.</desc>\n  <defs>\n    <style>\n      #cpInsets .title{fill:#161A26;font-size:22px;font-weight:700}\n      #cpInsets .sub{fill:#79809A;font-size:13.5px}\n      #cpInsets .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #cpInsets .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #cpInsets .nb{fill:#454C61;font-size:13px}\n      #cpInsets .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #cpInsets .foot{fill:#79809A;font-size:12px}\n      #cpInsets .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #cpInsets .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#cpInsets-arrow)}\n    </style>\n    <marker id=\"cpInsets-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"408\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Tres formas de decir cuánto aire</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">EdgeInsets dice cuántos píxeles dejar en cada lado. Se elige el constructor según qué lados sean iguales.</text>\n  <rect x=\"48\" y=\"128\" width=\"272\" height=\"152\" rx=\"8\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><rect x=\"72\" y=\"152\" width=\"224\" height=\"104\" rx=\"6\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/><text x=\"184.0\" y=\"204.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#4453C9\">child</text>\n  <text x=\"48\" y=\"316\" font-size=\"13.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" class=\"mono\" data-fit=\"272\">EdgeInsets.all(16)</text>\n  <text x=\"48\" y=\"342\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"272\">Lo mismo por los cuatro lados</text>\n  <rect x=\"344\" y=\"128\" width=\"272\" height=\"152\" rx=\"8\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><rect x=\"380\" y=\"140\" width=\"200\" height=\"128\" rx=\"6\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/><text x=\"480.0\" y=\"204.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#4453C9\">child</text>\n  <text x=\"344\" y=\"316\" font-size=\"13.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" class=\"mono\" data-fit=\"272\">EdgeInsets.symmetric(</text>\n  <text xml:space=\"preserve\" x=\"344\" y=\"336\" font-size=\"13.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" class=\"mono\" data-fit=\"272\">  horizontal: 24, vertical: 8)</text>\n  <text x=\"344\" y=\"362\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"272\">Unos lados y otros, por parejas</text>\n  <rect x=\"640\" y=\"128\" width=\"272\" height=\"152\" rx=\"8\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/><rect x=\"640\" y=\"164\" width=\"272\" height=\"116\" rx=\"6\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/><text x=\"776.0\" y=\"222.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\" fill=\"#4453C9\">child</text>\n  <text x=\"640\" y=\"316\" font-size=\"13.5\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" class=\"mono\" data-fit=\"272\">EdgeInsets.only(top: 24)</text>\n  <text x=\"640\" y=\"342\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"272\">Solo los lados que nombres</text>\n</svg>",
  cpCaja: "<svg id=\"cpCaja\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 344.0\" width=\"1116\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"cpCaja-ttl cpCaja-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"cpCaja-ttl\">Las capas de un Container</title>\n  <desc id=\"cpCaja-dsc\">Cajas anidadas. La de afuera es margin, el aire por fuera del Container. Sigue el borde y el fondo, que son la decoración. Adentro, padding, el aire entre el borde y el contenido. En el centro, el child.</desc>\n  <defs>\n    <style>\n      #cpCaja .title{fill:#161A26;font-size:22px;font-weight:700}\n      #cpCaja .sub{fill:#79809A;font-size:13.5px}\n      #cpCaja .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #cpCaja .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #cpCaja .nb{fill:#454C61;font-size:13px}\n      #cpCaja .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #cpCaja .foot{fill:#79809A;font-size:12px}\n      #cpCaja .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #cpCaja .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#cpCaja-arrow)}\n    </style>\n    <marker id=\"cpCaja-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"440\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Las capas de un <tspan class=\"mono\">Container</tspan></text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">De afuera hacia adentro: margin, la decoración, padding y el child.</text>\n  <rect x=\"96\" y=\"128\" width=\"400\" height=\"264\" rx=\"10\" fill=\"#EFF1F5\" stroke=\"#C4CBD8\" stroke-width=\"1.5\" stroke-dasharray=\"5 4\"/>\n  <rect x=\"136\" y=\"168\" width=\"320\" height=\"184\" rx=\"18\" fill=\"#FFF3DC\" stroke=\"#4453C9\" stroke-width=\"3\"/>\n  <rect x=\"172\" y=\"204\" width=\"248\" height=\"112\" rx=\"6\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <text x=\"296\" y=\"265\" font-size=\"15\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"middle\" class=\"mono\">child</text>\n  <path d=\"M478,148 H556\" stroke=\"#556074\" stroke-width=\"1.5\"/><circle cx=\"478\" cy=\"148\" r=\"3.5\" fill=\"#556074\"/>\n  <text x=\"572\" y=\"144\" font-size=\"15\" font-weight=\"700\" fill=\"#556074\" text-anchor=\"start\" class=\"mono\" data-fit=\"340\">margin</text>\n  <text x=\"572\" y=\"165\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"340\">Aire por fuera. Separa la caja de sus vecinas.</text>\n  <path d=\"M438,216 H556\" stroke=\"#A96C05\" stroke-width=\"1.5\"/><circle cx=\"438\" cy=\"216\" r=\"3.5\" fill=\"#A96C05\"/>\n  <text x=\"572\" y=\"212\" font-size=\"15\" font-weight=\"700\" fill=\"#A96C05\" text-anchor=\"start\" class=\"mono\" data-fit=\"340\">padding</text>\n  <text x=\"572\" y=\"233\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"340\">Aire por dentro, entre el borde y el contenido.</text>\n  <path d=\"M404,284 H556\" stroke=\"#4453C9\" stroke-width=\"1.5\"/><circle cx=\"404\" cy=\"284\" r=\"3.5\" fill=\"#4453C9\"/>\n  <text x=\"572\" y=\"280\" font-size=\"15\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"start\" class=\"mono\" data-fit=\"340\">child</text>\n  <text x=\"572\" y=\"301\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"340\">El contenido: un solo widget.</text>\n  <path d=\"M456,340 H556\" stroke=\"#4453C9\" stroke-width=\"1.5\"/><circle cx=\"456\" cy=\"340\" r=\"3.5\" fill=\"#4453C9\"/>\n  <text x=\"572\" y=\"336\" font-size=\"15\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"start\" class=\"mono\" data-fit=\"340\">decoration</text>\n  <text x=\"572\" y=\"357\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"340\">El fondo, el borde y las esquinas.</text>\n</svg>",
  exSobra: "<svg id=\"exSobra\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 336.0\" width=\"1143\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"exSobra-ttl exSobra-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"exSobra-ttl\">Una fila con un texto largo</title>\n  <desc id=\"exSobra-dsc\">La misma fila de chat dos veces. Arriba, sin Expanded, el mensaje se sale por la derecha de la pantalla y aparece la franja amarilla y negra. Abajo, con Expanded, la columna de textos ocupa el espacio que dejan la foto y la hora, y el mensaje se corta con puntos suspensivos.</desc>\n  <defs>\n    <style>\n      #exSobra .title{fill:#161A26;font-size:22px;font-weight:700}\n      #exSobra .sub{fill:#79809A;font-size:13.5px}\n      #exSobra .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #exSobra .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #exSobra .nb{fill:#454C61;font-size:13px}\n      #exSobra .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #exSobra .foot{fill:#79809A;font-size:12px}\n      #exSobra .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #exSobra .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#exSobra-arrow)}\n    </style>\n    <marker id=\"exSobra-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"432\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Una fila con un texto largo</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Sin Expanded, el texto pide todo el ancho que necesita. Con Expanded, recibe solo el que sobra.</text>\n  <defs><pattern id=\"exSobra-warn\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"10\" height=\"10\" fill=\"#FFD600\"/><rect width=\"5\" height=\"10\" fill=\"#1F2430\"/></pattern></defs>\n  <rect x=\"232\" y=\"128\" width=\"560\" height=\"80\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <circle cx=\"272\" cy=\"168\" r=\"24\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\"/><circle cx=\"272\" cy=\"163.2\" r=\"7.9\" fill=\"#F0C572\"/><path d=\"M257.1,185.8 a14.9,13.4 0 0 1 29.8,0 Z\" fill=\"#F0C572\"/>\n  <text x=\"312\" y=\"162\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\">Javier Montes</text>\n  <rect x=\"232\" y=\"264\" width=\"560\" height=\"80\" rx=\"10\" fill=\"#FFFFFF\" stroke=\"#D9DEE8\" stroke-width=\"1.5\"/>\n  <circle cx=\"272\" cy=\"304\" r=\"24\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\"/><circle cx=\"272\" cy=\"299.2\" r=\"7.9\" fill=\"#F0C572\"/><path d=\"M257.1,321.8 a14.9,13.4 0 0 1 29.8,0 Z\" fill=\"#F0C572\"/>\n  <text x=\"312\" y=\"298\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\">Javier Montes</text>\n  <text x=\"312\" y=\"184\" font-size=\"13.5\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\">¿Te parece si revisamos los avances del proyecto antes de la reunión de mañana con el cliente?</text>\n  <rect x=\"792\" y=\"120\" width=\"140\" height=\"96\" fill=\"#FFFFFF\" fill-opacity=\".72\"/>\n  <rect x=\"778\" y=\"128\" width=\"14\" height=\"80\" fill=\"url(#exSobra-warn)\"/>\n  <rect x=\"304\" y=\"272\" width=\"412\" height=\"64\" rx=\"8\" fill=\"#3A8235\" fill-opacity=\".08\" stroke=\"#3A8235\" stroke-width=\"2\"/>\n  <text x=\"312\" y=\"320\" font-size=\"13.5\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"400\">¿Te parece si revisamos los avances del proyecto antes…</text>\n  <text x=\"776\" y=\"309\" font-size=\"13\" font-weight=\"400\" fill=\"#79809A\" text-anchor=\"end\">10:24</text>\n  <path d=\"M244,364 V370 H300 V364\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.5\"/>\n  <text x=\"272.0\" y=\"390\" font-size=\"12.5\" font-weight=\"700\" fill=\"#556074\" text-anchor=\"middle\">fijo</text>\n  <path d=\"M304,364 V370 H716 V364\" fill=\"none\" stroke=\"#3A8235\" stroke-width=\"1.5\"/>\n  <text x=\"510.0\" y=\"390\" font-size=\"12.5\" font-weight=\"700\" fill=\"#3A8235\" text-anchor=\"middle\">Expanded: lo que sobra</text>\n  <path d=\"M724,364 V370 H784 V364\" fill=\"none\" stroke=\"#556074\" stroke-width=\"1.5\"/>\n  <text x=\"754.0\" y=\"390\" font-size=\"12.5\" font-weight=\"700\" fill=\"#556074\" text-anchor=\"middle\">fijo</text>\n  <text x=\"48\" y=\"162\" font-size=\"15\" font-weight=\"700\" fill=\"#C2354F\" text-anchor=\"start\" data-fit=\"170\">Sin Expanded</text>\n  <text x=\"48\" y=\"184\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"170\">El texto se sale.</text>\n  <text x=\"48\" y=\"298\" font-size=\"15\" font-weight=\"700\" fill=\"#3A8235\" text-anchor=\"start\" data-fit=\"170\">Con Expanded</text>\n  <text x=\"48\" y=\"320\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"170\">El texto se ajusta.</text>\n</svg>",
  exFlex: "<svg id=\"exFlex\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 296.0\" width=\"1216\" height=\"375\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"exFlex-ttl exFlex-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"exFlex-ttl\">Repartir el espacio con flex</title>\n  <desc id=\"exFlex-dsc\">Tres filas del mismo ancho. En la primera, dos Expanded se reparten la fila por mitades. En la segunda, uno con flex 2 y otro con flex 1 se la reparten en dos tercios y un tercio. En la tercera, un hijo de ancho fijo conserva su tamaño y un Expanded ocupa el resto.</desc>\n  <defs>\n    <style>\n      #exFlex .title{fill:#161A26;font-size:22px;font-weight:700}\n      #exFlex .sub{fill:#79809A;font-size:13.5px}\n      #exFlex .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #exFlex .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #exFlex .nb{fill:#454C61;font-size:13px}\n      #exFlex .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #exFlex .foot{fill:#79809A;font-size:12px}\n      #exFlex .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #exFlex .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#exFlex-arrow)}\n    </style>\n    <marker id=\"exFlex-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"392\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Repartir el espacio con <tspan class=\"mono\">flex</tspan></text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Cuando hay varios Expanded en la misma fila, se reparten lo que sobra. flex dice en qué proporción.</text>\n  <text x=\"48\" y=\"150\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"290\">Mitad y mitad</text>\n  <text x=\"48\" y=\"171\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"290\">Dos Expanded sin flex.</text>\n  <rect x=\"368\" y=\"128\" width=\"268\" height=\"56\" rx=\"8\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"502\" y=\"156\" font-size=\"13\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"middle\" class=\"mono\" data-fit=\"252\">Expanded</text>\n  <rect x=\"644\" y=\"128\" width=\"268\" height=\"56\" rx=\"8\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"778\" y=\"156\" font-size=\"13\" font-weight=\"700\" fill=\"#7439B8\" text-anchor=\"middle\" class=\"mono\" data-fit=\"252\">Expanded</text>\n  <text x=\"48\" y=\"230\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"290\">Dos partes y una</text>\n  <text x=\"48\" y=\"251\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"290\">El primero recibe el doble.</text>\n  <rect x=\"368\" y=\"208\" width=\"357\" height=\"56\" rx=\"8\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"547\" y=\"236\" font-size=\"13\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"middle\" class=\"mono\" data-fit=\"341\">Expanded(flex: 2)</text>\n  <rect x=\"733\" y=\"208\" width=\"179\" height=\"56\" rx=\"8\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"823\" y=\"236\" font-size=\"13\" font-weight=\"700\" fill=\"#7439B8\" text-anchor=\"middle\" class=\"mono\" data-fit=\"163\">Expanded(flex: 1)</text>\n  <text x=\"48\" y=\"310\" font-size=\"15\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"start\" data-fit=\"290\">Uno fijo y uno flexible</text>\n  <text x=\"48\" y=\"331\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"start\" data-fit=\"290\">Primero se mide el fijo.</text>\n  <rect x=\"368\" y=\"288\" width=\"136\" height=\"56\" rx=\"8\" fill=\"#EFF1F5\" stroke=\"#C4CBD8\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"436\" y=\"316\" font-size=\"13\" font-weight=\"700\" fill=\"#556074\" text-anchor=\"middle\" class=\"mono\" data-fit=\"120\">ancho fijo</text>\n  <rect x=\"512\" y=\"288\" width=\"400\" height=\"56\" rx=\"8\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"712\" y=\"316\" font-size=\"13\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"middle\" class=\"mono\" data-fit=\"384\">Expanded</text>\n</svg>",
  scVentana: "<svg id=\"scVentana\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 568.0\" width=\"727\" height=\"430\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"scVentana-ttl scVentana-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"scVentana-ttl\">La pantalla es una ventana</title>\n  <desc id=\"scVentana-dsc\">La misma pila de componentes en dos celulares. A la izquierda, sin scroll, lo que no cabe queda por fuera de la pantalla y aparece la franja amarilla y negra abajo. A la derecha, con SingleChildScrollView, la columna conserva todo su alto y sigue por debajo del celular: la pantalla es una ventana que se desliza sobre ella.</desc>\n  <defs>\n    <style>\n      #scVentana .title{fill:#161A26;font-size:22px;font-weight:700}\n      #scVentana .sub{fill:#79809A;font-size:13.5px}\n      #scVentana .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #scVentana .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #scVentana .nb{fill:#454C61;font-size:13px}\n      #scVentana .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #scVentana .foot{fill:#79809A;font-size:12px}\n      #scVentana .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #scVentana .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#scVentana-arrow)}\n    </style>\n    <marker id=\"scVentana-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"664\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">La pantalla es una ventana</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Los componentes del perfil miden más que la pantalla. Con scroll, la pantalla se desliza sobre ellos.</text>\n  <defs><pattern id=\"scVentana-warn\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><rect width=\"10\" height=\"10\" fill=\"#FFD600\"/><rect width=\"5\" height=\"10\" fill=\"#1F2430\"/></pattern></defs>\n  <clipPath id=\"scVentana-a\"><rect width=\"200\" height=\"300\" rx=\"20\"/></clipPath><rect x=\"105\" y=\"125\" width=\"214\" height=\"314\" rx=\"27\" fill=\"#1F2430\"/><g transform=\"translate(112,132)\"><g clip-path=\"url(#scVentana-a)\"><rect width=\"200\" height=\"300\" rx=\"20\" fill=\"#FFFFFF\"/><g><rect x=\"10\" y=\"10\" width=\"180\" height=\"90\" rx=\"8\" fill=\"#F4EBFF\" stroke=\"#C9A6EE\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"55.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#7439B8\" font-family=\"ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace\">ProfileInfo</text></g><g><rect x=\"10\" y=\"110\" width=\"180\" height=\"56\" rx=\"8\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"138.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#4453C9\" font-family=\"ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace\">StatsRow</text></g><g><rect x=\"10\" y=\"176\" width=\"180\" height=\"36\" rx=\"8\" fill=\"#E3F6F3\" stroke=\"#86D3CA\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"194.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#0F8478\" font-family=\"ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace\">PrimaryButton</text></g><g><rect x=\"10\" y=\"222\" width=\"180\" height=\"72\" rx=\"8\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\"/><text x=\"100.0\" y=\"258.0\" dy=\"0.35em\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"700\" fill=\"#A96C05\" font-family=\"ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace\">ContactCard × 4</text></g><g><re   scHorizontal: "<svg id=\"scHorizontal\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 324.0\" width=\"1185\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"scHorizontal-ttl scHorizontal-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"scHorizontal-ttl\">El mismo scroll, de lado</title>\n  <desc id=\"scHorizontal-dsc\">Una fila de seis tarjetas de contacto más ancha que la pantalla. Un marco muestra el ancho de la pantalla: tres tarjetas se ven completas y las demás quedan por fuera, a los lados, hasta que la persona desliza la fila.</desc>\n  <defs>\n    <style>\n      #scHorizontal .title{fill:#161A26;font-size:22px;font-weight:700}\n      #scHorizontal .sub{fill:#79809A;font-size:13.5px}\n      #scHorizontal .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #scHorizontal .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #scHorizontal .nb{fill:#454C61;font-size:13px}\n      #scHorizontal .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #scHorizontal .foot{fill:#79809A;font-size:12px}\n      #scHorizontal .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #scHorizontal .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#scHorizontal-arrow)}\n    </style>\n    <marker id=\"scHorizontal-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"420\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">El mismo scroll, de lado</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Con scrollDirection horizontal, lo que se desliza es una Row. Es la fila de contactos sugeridos.</text>\n  <g opacity=\".4\"><rect x=\"156   apCapas: "<svg id=\"apCapas\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 96 960 368.0\" width=\"1043\" height=\"400\" style=\"display:block;margin:0 auto\" role=\"img\" aria-labelledby=\"apCapas-ttl apCapas-dsc\" font-family=\"ui-sans-serif, -apple-system, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif\">\n  <title id=\"apCapas-ttl\">Una pantalla, de afuera hacia adentro</title>\n  <desc id=\"apCapas-dsc\">Cajas anidadas. La de afuera es Scaffold, la pantalla. Adentro, SafeArea, que aleja el contenido de los bordes. Adentro, SingleChildScrollView, que lo deja deslizar. Adentro, Column, que apila. En el centro, tres componentes: ProfileInfo, StatsRow y ChatItem.</desc>\n  <defs>\n    <style>\n      #apCapas .title{fill:#161A26;font-size:22px;font-weight:700}\n      #apCapas .sub{fill:#79809A;font-size:13.5px}\n      #apCapas .h{font-size:12px;font-weight:700;letter-spacing:.08em;fill:#556074}\n      #apCapas .nt{font-size:15px;font-weight:700;fill:#161A26}\n      #apCapas .nb{fill:#454C61;font-size:13px}\n      #apCapas .lbl{fill:#556074;font-size:12px;font-weight:600}\n      #apCapas .foot{fill:#79809A;font-size:12px}\n      #apCapas .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}\n      #apCapas .link{fill:none;stroke:#556074;stroke-width:1.75;marker-end:url(#apCapas-arrow)}\n    </style>\n    <marker id=\"apCapas-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" markerUnits=\"strokeWidth\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 L2.4,5 Z\" fill=\"#556074\"/>\n    </marker>\n  </defs>\n  <rect width=\"960\" height=\"464\" rx=\"16\" fill=\"#FFFFFF\"/>\n  <text class=\"title\" x=\"48\" y=\"56\">Una pantalla, de afuera hacia adentro</text>\n  <text class=\"sub\" x=\"48\" y=\"80\" data-fit=\"860\">Cada widget envuelve al siguiente y resuelve una sola cosa. Tus componentes van en el centro.</text>\n  <rect x=\"48\" y=\"112\" width=\"864\" height=\"304\" rx=\"12\" fill=\"#EEF1FF\" stroke=\"#A9B4F2\" stroke-width=\"1.5\"/>\n  <text x=\"64\" y=\"139\" font-size=\"14.5\" font-weight=\"700\" fill=\"#4453C9\" text-anchor=\"start\" class=\"mono\">Scaffold</text>\n  <text x=\"896\" y=\"139\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"end\" data-fit=\"360\">La pantalla: fondo y barra</text>\n  <rect x=\"72\" y=\"156\" width=\"816\" height=\"244\" rx=\"12\" fill=\"#E8F6E3\" stroke=\"#9FD68D\" stroke-width=\"1.5\"/>\n  <text x=\"88\" y=\"183\" font-size=\"14.5\" font-weight=\"700\" fill=\"#3A8235\" text-anchor=\"start\" class=\"mono\">SafeArea</text>\n  <text x=\"872\" y=\"183\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"end\" data-fit=\"360\">Lejos de la cámara y de los gestos</text>\n  <rect x=\"96\" y=\"200\" width=\"768\" height=\"184\" rx=\"12\" fill=\"#FFF3DC\" stroke=\"#F0C572\" stroke-width=\"1.5\"/>\n  <text x=\"112\" y=\"227\" font-size=\"14.5\" font-weight=\"700\" fill=\"#A96C05\" text-anchor=\"start\" class=\"mono\">SingleChildScrollView</text>\n  <text x=\"848\" y=\"227\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"end\" data-fit=\"360\">Se desliza si no cabe</text>\n  <rect x=\"120\" y=\"244\" width=\"720\" height=\"124\" rx=\"12\" fill=\"#E3F6F3\" stroke=\"#86D3CA\" stroke-width=\"1.5\"/>\n  <text x=\"136\" y=\"271\" font-size=\"14.5\" font-weight=\"700\" fill=\"#0F8478\" text-anchor=\"start\" class=\"mono\">Column</text>\n  <text x=\"824\" y=\"271\" font-size=\"13\" font-weight=\"400\" fill=\"#556074\" text-anchor=\"end\" data-fit=\"360\">Apila uno debajo de otro</text>\n  <rect x=\"136\" y=\"288\" width=\"224\" height=\"64\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#C4CBD8\" stroke-width=\"1.5\"/>\n  <text dy=\"0.35em\" x=\"248\" y=\"320\" font-size=\"14\" font-weight=\"700\" fill=\"#161A26\" text-anchor=\"middle\" class=\"mono\">ProfileInfo</text>\n  <rect x=\"368\" y=\"288\" width=\"224\" height=\"64\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"#
